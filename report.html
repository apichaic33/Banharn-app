<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#6C3212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="บ้านเฮือน">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>รายงาน — บัญชีครัวเรือน & เกษตร</title>
  <link href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&family=Sarabun:wght@300;400;500;600;700&family=Mitr:wght@400;500;600&family=Thasadith:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #6C3212; --primary2: #9C4722; --accent: #C87629;
      --income: #4A7A3A; --expense: #8B3020; --warn: #9B6828;
      --bg: #F5EFE6; --surface: #FDFAF6; --surface2: #F0E8DB;
      --border: #E0D5C4; --text: #2A1A0E; --text-sub: #8A7060;
      --shadow-sm: 0 1px 6px rgba(61,35,20,.10); --shadow: 0 4px 20px rgba(61,35,20,.13);
      --r: 16px; --r-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    a,a:visited,a:link,a:active { color: inherit; text-decoration: none; }
    button { color: inherit; }
    select,input,textarea { color: var(--text); accent-color: var(--primary); }
    select option { background: var(--surface); color: var(--text); }
    body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; }
    html,body { background: #F5EFE6 !important; }

    .app-header {
      background: #6C3212; color: #FAF0E6;
      padding: max(38px, calc(env(safe-area-inset-top, 20px) + 16px)) 20px 22px;
      position: sticky; top: 0; z-index: 100;
      border-radius: 0 0 28px 28px; box-shadow: 0 6px 24px rgba(61,35,20,.22); margin-bottom: 0;
    }
    .header-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .app-title { font-family: 'Thasadith', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: 0.3px; }
    .header-date { font-size: 12px; font-family: 'K2D', sans-serif; font-weight: 300; opacity: 0.75; margin-top: 3px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .sync-row { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 11px; font-family: 'K2D', sans-serif; font-weight: 300; opacity: 0.7; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #A89070; }
    .sync-dot.offline { background: #C07050; }
    .main-content { padding: 16px 15px 100px; margin-top: 0; }
    .card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .sec-label { font-family: 'Mitr', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: #8A7A68; margin: 18px 0 8px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
      background: #FDFAF6; border-top: 1px solid #E0D5C4; display: flex; z-index: 200;
      box-shadow: 0 -4px 24px rgba(61,35,20,.12);
      padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
    }
    .nav-btn { flex: 1; padding: 10px 4px 8px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8A7A68 !important; -webkit-text-fill-color: #8A7A68 !important; transition: color 0.2s; font-family: 'Sarabun', sans-serif; -webkit-appearance: none; outline: none; }
    .nav-btn.active { color: #6C3212 !important; -webkit-text-fill-color: #6C3212 !important; }
    .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
    .nav-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-label { font-size: 10px; font-weight: 500; color: inherit !important; -webkit-text-fill-color: inherit !important; }
    .page { display: none; } .page.active { display: block; }
    .tab-bar { display: flex; background: #F0E8DB; border-radius: 24px; padding: 4px; gap: 4px; margin-bottom: 14px; border: 1px solid var(--border); box-shadow: inset 0 1px 3px rgba(61,35,20,.08); }
    .tab-btn { flex: 1; padding: 8px 4px; border: none; background: none; border-radius: 20px; font-family: 'Sarabun', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; color: #7A6A58 !important; -webkit-text-fill-color: #7A6A58 !important; transition: all 0.18s; }
    .tab-btn.active { background: #6C3212; color: #F2EDE4 !important; -webkit-text-fill-color: #F2EDE4 !important; }
    .tab-content { display: none; } .tab-content.active { display: block; }
    .chart-box { background: var(--surface); border-radius: var(--r); padding: 15px; margin-bottom: 12px; border: 1px solid var(--border); }
    .chart-title { font-family: 'Mitr', sans-serif; font-size: 13px; font-weight: 500; color: var(--text-sub); margin-bottom: 12px; letter-spacing: 0.3px; }
    canvas { max-height: 180px; }
    .yoy-kpi-card { background: #FDFAF6; border-radius: 14px; padding: 12px 8px; text-align: center; border: 1px solid #E0D5C4; box-shadow: 0 1px 6px rgba(61,35,20,.10); }
    .yoy-summary-card { background: #FDFAF6; border-radius: 14px; padding: 14px 12px; border: 1px solid #E0D5C4; box-shadow: 0 1px 6px rgba(61,35,20,.10); }
    .yoy-table-header { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; background: #EDE7DB; padding: 10px 12px; border-bottom: 1px solid #E0D5C4; }
    .yoy-table-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; padding: 9px 12px; border-bottom: 1px solid #F0E8DB; }
    .yoy-table-footer { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; background: #EDE7DB; padding: 10px 12px; }
    .yoy-col-label { font-size: 11px; font-weight: 600; font-family: 'Mitr', sans-serif; color: #6C3212 !important; -webkit-text-fill-color: #6C3212 !important; }
    .yoy-col-inc { font-size: 11px; font-weight: 600; font-family: 'Mitr', sans-serif; color: #4A5E38 !important; -webkit-text-fill-color: #4A5E38 !important; text-align: right; }
    .yoy-col-exp { font-size: 11px; font-weight: 600; font-family: 'Mitr', sans-serif; color: #7A3020 !important; -webkit-text-fill-color: #7A3020 !important; text-align: right; }
    .modal-overlay { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100vw; max-width: 480px; background: rgba(0,0,0,.4); z-index: 9000; display: none; align-items: flex-end; pointer-events: none; }
    .modal-overlay.open { display: flex; pointer-events: all; }
    .modal-sheet { background: #EDE7DB; border-radius: 28px 28px 0 0; width: 100%; max-width: 480px; margin: 0; padding: 20px 24px 52px; max-height: 88vh; overflow-y: auto; animation: slideUp 0.25s ease; box-shadow: 0 -4px 32px rgba(61,35,20,.18); box-sizing: border-box; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    * { color: inherit; }
    a,a:visited,a:link,a:active,a:hover { color: inherit !important; text-decoration: none; }
    input,select,textarea { color: #1A1208 !important; -webkit-text-fill-color: #1A1208 !important; }
  </style>
</head>
<body>

  <div class="app-header" style="background:#6C3212;">
    <div class="header-row">
      <div><div class="app-title" style="color:#FAF0E6!important;-webkit-text-fill-color:#FAF0E6!important;">รายงานภาพรวม</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button id="rp-btn-home" onclick="rpSetAcc('home')" style="flex:1;padding:7px;border:1.5px solid rgba(255,255,255,0.55);background:rgba(255,255,255,0.2);border-radius:10px;color:#FAF0E6!important;-webkit-text-fill-color:#FAF0E6!important;cursor:pointer;font-family:Sarabun,sans-serif;font-size:13px;">ครัวเรือน</button>
      <button id="rp-btn-farm" onclick="rpSetAcc('farm')" style="flex:1;padding:7px;border:1.5px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.1);border-radius:10px;color:rgba(250,240,230,0.55)!important;-webkit-text-fill-color:rgba(250,240,230,0.55)!important;cursor:pointer;font-family:Sarabun,sans-serif;font-size:13px;">การเกษตร</button>
    </div>
    <div style="display:flex;background:rgba(0,0,0,0.18);border-radius:20px;padding:3px;gap:3px;margin-top:10px;">
      <button id="rp-tab-overview-btn" onclick="rpSwitchTab('overview')" style="flex:1;padding:7px 4px;border:none;border-radius:17px;font-family:Sarabun,sans-serif;font-size:12px;font-weight:600;cursor:pointer;background:rgba(255,255,255,0.22);color:#FAF0E6!important;-webkit-text-fill-color:#FAF0E6!important;transition:all 0.18s;">ภาพรวม</button>
      <button id="rp-tab-yoy-btn" onclick="rpSwitchTab('yoy')" style="flex:1;padding:7px 4px;border:none;border-radius:17px;font-family:Sarabun,sans-serif;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:rgba(250,240,230,0.65)!important;-webkit-text-fill-color:rgba(250,240,230,0.65)!important;transition:all 0.18s;">เปรียบเทียบ YoY</button>
    </div>
  </div>

  <div class="main-content">
    <div id="rp-tab-overview" class="tab-content active">
      <div class="chart-box"><div class="chart-title">รายรับ — รายจ่าย 6 เดือนล่าสุด</div><canvas id="rp-month-chart"></canvas></div>
      <div class="chart-box"><div class="chart-title">รายจ่ายตามหมวดหมู่เดือนนี้</div><canvas id="rp-cat-chart"></canvas></div>
    </div>
    <div id="rp-tab-yoy" class="tab-content">
      <div class="sec-label" style="margin-top:4px;">เปรียบเทียบปีต่อปี (YoY)</div>
      <div style="background:#FDFAF6;border-radius:14px;padding:12px 14px;border:1px solid #E0D5C4;margin-bottom:14px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:12px;color:#8A7A68;white-space:nowrap;">เทียบปี</span>
        <select id="yoy-year-a" onchange="yoyRender()" style="flex:1;padding:7px 10px;border-radius:9px;border:1.5px solid #E0D5C4;background:#F2EDE4;font-family:Mitr,sans-serif;font-size:13px;"></select>
        <span style="font-size:12px;color:#8A7A68;">vs</span>
        <select id="yoy-year-b" onchange="yoyRender()" style="flex:1;padding:7px 10px;border-radius:9px;border:1.5px solid #E0D5C4;background:#F2EDE4;font-family:Mitr,sans-serif;font-size:13px;"></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
        <div class="yoy-summary-card"><div style="font-size:11px;color:#8A7A68;margin-bottom:6px;" id="yoy-label-a">ปี —</div><div style="font-family:Mitr,sans-serif;font-size:13px;font-weight:600;color:#4A5E38!important;-webkit-text-fill-color:#4A5E38!important;margin-bottom:3px;">รายรับ <span id="yoy-inc-a">0</span></div><div style="font-family:Mitr,sans-serif;font-size:13px;font-weight:600;color:#7A3020!important;-webkit-text-fill-color:#7A3020!important;margin-bottom:3px;">รายจ่าย <span id="yoy-exp-a">0</span></div><div style="font-family:Mitr,sans-serif;font-size:13px;font-weight:600;color:#2C2010!important;-webkit-text-fill-color:#2C2010!important;">คงเหลือ <span id="yoy-bal-a">0</span></div></div>
        <div class="yoy-summary-card"><div style="font-size:11px;color:#8A7A68;margin-bottom:6px;" id="yoy-label-b">ปี —</div><div style="font-family:Mitr,sans-serif;font-size:13px;font-weight:600;color:#4A5E38!important;-webkit-text-fill-color:#4A5E38!important;margin-bottom:3px;">รายรับ <span id="yoy-inc-b">0</span></div><div style="font-family:Mitr,sans-serif;font-size:13px;font-weight:600;color:#7A3020!important;-webkit-text-fill-color:#7A3020!important;margin-bottom:3px;">รายจ่าย <span id="yoy-exp-b">0</span></div><div style="font-family:Mitr,sans-serif;font-size:13px;font-weight:600;color:#2C2010!important;-webkit-text-fill-color:#2C2010!important;">คงเหลือ <span id="yoy-bal-b">0</span></div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;" id="yoy-kpi-strip"></div>
      <div class="chart-box" style="margin-bottom:12px;"><div class="chart-title">รายรับ — รายจ่าย รายเดือน</div><canvas id="yoy-month-chart" style="height:220px;"></canvas></div>
      <div class="chart-box" style="margin-bottom:12px;"><div class="chart-title">รายจ่ายตามหมวดหมู่ เปรียบเทียบ 2 ปี</div><canvas id="yoy-cat-chart" style="max-height:200px;"></canvas></div>
      <div class="sec-label">ตารางเปรียบเทียบรายเดือน</div>
      <div style="background:#FDFAF6;border-radius:16px;border:1px solid #E0D5C4;overflow:hidden;margin-bottom:20px;"><div id="yoy-table"></div></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="location.href='index.html'">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <span class="nav-label">หน้าหลัก</span>
    </button>
    <button class="nav-btn" onclick="location.href='manage.html'">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div>
      <span class="nav-label">จัดการ</span>
    </button>
    <button class="nav-btn active" onclick="location.href='report.html'">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
      <span class="nav-label">รายงาน</span>
    </button>
  </div>

<script>
var MONTHS_TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var MONTHS_SHORT=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var CATEGORIES={home:{income:['เงินเดือน','โบนัส','ค่าเช่า','ดอกเบี้ย','อื่นๆ'],expense:['อาหาร','เดินทาง','สาธารณูปโภค','ช้อปปิ้ง','สุขภาพ','บันเทิง','การศึกษา','ซ่อมบำรุง','อื่นๆ']},farm:{income:['ขายพืชผล','ขายสัตว์','เงินอุดหนุน','อื่นๆ'],expense:['เมล็ดพันธุ์','ปุ๋ย','ยาฆ่าแมลง','น้ำมัน','ค่าแรง','อุปกรณ์','อื่นๆ']}};

var GAS_URL = 'https://script.google.com/macros/s/AKfycbzmVePBscvTiDxZVyh6Ba4ovAo-t-UFw5HkyU9HNn3qfmf_t3RrtKmCvmZ4DD9KjjOs/exec';
var _gasUrl = GAS_URL;
var DATA=(function(){var r=localStorage.getItem('banharnData');try{return r?JSON.parse(r):{home:{transactions:[],budgets:[],debts:[]},farm:{transactions:[],budgets:[],debts:[]}};}catch(e){return {home:{transactions:[],budgets:[],debts:[]},farm:{transactions:[],budgets:[],debts:[]}};}})();
function saveData(){localStorage.setItem('banharnData',JSON.stringify(DATA));}
function _doInitialLoad(){
  if(!_gasUrl)return;
  fetch(_gasUrl+'?action=pull',{redirect:'follow'})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.status==='ok'&&d.home&&d.farm){
      DATA.home=d.home; DATA.farm=d.farm;
      localStorage.setItem('banharnData',JSON.stringify(DATA));
      init();
    }
  }).catch(function(){});
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

function fmt(n){return (parseFloat(n)||0).toLocaleString('th-TH');}
function openModal(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';}
function closeModal(id){document.getElementById(id).classList.remove('open');document.body.style.overflow='';}
var _rpAcc='home';var _rpTab='overview';var rpMChart=null,rpCChart=null;var yoyMChart=null,yoyCChart=null;
function init(){rpSetAcc('home');yoyInitYears();}
function rpSetAcc(acc){_rpAcc=acc;var bh=document.getElementById('rp-btn-home'),bf=document.getElementById('rp-btn-farm');bh.style.background=acc==='home'?'rgba(255,255,255,0.22)':'rgba(255,255,255,0.1)';bh.style.borderColor=acc==='home'?'rgba(255,255,255,0.55)':'rgba(255,255,255,0.35)';bh.style.color=acc==='home'?'#FAF0E6':'rgba(250,240,230,0.75)';bh.style.webkitTextFillColor=acc==='home'?'#FAF0E6':'rgba(250,240,230,0.75)';bf.style.background=acc==='farm'?'rgba(255,255,255,0.22)':'rgba(255,255,255,0.1)';bf.style.borderColor=acc==='farm'?'rgba(255,255,255,0.55)':'rgba(255,255,255,0.35)';bf.style.color=acc==='farm'?'#FAF0E6':'rgba(250,240,230,0.75)';bf.style.webkitTextFillColor=acc==='farm'?'#FAF0E6':'rgba(250,240,230,0.75)';if(_rpTab==='yoy')yoyRender();else rpRenderCharts();}
function rpSwitchTab(tab){_rpTab=tab;var ob=document.getElementById('rp-tab-overview-btn'),yb=document.getElementById('rp-tab-yoy-btn');ob.style.background=tab==='overview'?'rgba(255,255,255,0.22)':'transparent';ob.style.color=tab==='overview'?'#FAF0E6':'rgba(250,240,230,0.65)';ob.style.webkitTextFillColor=tab==='overview'?'#FAF0E6':'rgba(250,240,230,0.65)';yb.style.background=tab==='yoy'?'rgba(255,255,255,0.22)':'transparent';yb.style.color=tab==='yoy'?'#FAF0E6':'rgba(250,240,230,0.65)';yb.style.webkitTextFillColor=tab==='yoy'?'#FAF0E6':'rgba(250,240,230,0.65)';document.getElementById('rp-tab-overview').classList.toggle('active',tab==='overview');document.getElementById('rp-tab-yoy').classList.toggle('active',tab==='yoy');window.scrollTo(0,0);if(tab==='overview')rpRenderCharts();else{yoyInitYears();yoyRender();}}
function rpRenderCharts(){var acc=_rpAcc,now=new Date(),labels=[],incs=[],exps=[];for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);labels.push(MONTHS_TH[d.getMonth()].slice(0,3));var mt=DATA[acc].transactions.filter(function(t){var td=new Date(t.date);return td.getMonth()===d.getMonth()&&td.getFullYear()===d.getFullYear();});incs.push(mt.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+t.amount;},0));exps.push(mt.filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0));}if(rpMChart)rpMChart.destroy();rpMChart=new Chart(document.getElementById('rp-month-chart').getContext('2d'),{type:'bar',data:{labels:labels,datasets:[{label:'รายรับ',data:incs,backgroundColor:'rgba(74,122,58,0.80)',borderRadius:5},{label:'รายจ่าย',data:exps,backgroundColor:'rgba(139,48,32,0.75)',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{font:{family:'Sarabun',size:12},boxWidth:12}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#C8C0B0'}}}}});var cur=DATA[acc].transactions.filter(function(t){var d=new Date(t.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()&&t.type==='expense';});var catMap={};cur.forEach(function(t){var k=t.category||'อื่นๆ';catMap[k]=(catMap[k]||0)+t.amount;});var cl=Object.keys(catMap),cv=Object.values(catMap);var colors=['#6C3212','#9C4722','#C87629','#4A7A3A','#8B3020','#8B6E3C','#5A2A10','#7A5A30','#4A6040'];if(rpCChart)rpCChart.destroy();if(!cl.length){var ctx=document.getElementById('rp-cat-chart').getContext('2d');ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);return;}rpCChart=new Chart(document.getElementById('rp-cat-chart').getContext('2d'),{type:'doughnut',data:{labels:cl,datasets:[{data:cv,backgroundColor:colors.slice(0,cl.length),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{font:{family:'Sarabun',size:11},boxWidth:10,padding:8}}}}});}
function yoyInitYears(){var years=new Set();var now=new Date().getFullYear();years.add(now);years.add(now-1);['home','farm'].forEach(function(acc){DATA[acc].transactions.forEach(function(t){years.add(new Date(t.date).getFullYear());});});var sorted=Array.from(years).sort(function(a,b){return b-a;});['yoy-year-a','yoy-year-b'].forEach(function(id,i){var sel=document.getElementById(id);var cur=parseInt(sel.value)||0;sel.innerHTML=sorted.map(function(y){var isSel=cur?(y===cur):(y===sorted[i]);return '<option value="'+y+'" '+(isSel?'selected':'')+'>'+( y+543)+'</option>';}).join('');});}
function yoyGetYearData(acc,year){var monthly=Array.from({length:12},function(){return {inc:0,exp:0};});var catMap={};DATA[acc].transactions.forEach(function(t){var d=new Date(t.date);if(d.getFullYear()!==year)return;var m=d.getMonth();if(t.type==='income')monthly[m].inc+=t.amount;else{monthly[m].exp+=t.amount;var k=t.category||'อื่นๆ';catMap[k]=(catMap[k]||0)+t.amount;}});var totalInc=monthly.reduce(function(s,m){return s+m.inc;},0);var totalExp=monthly.reduce(function(s,m){return s+m.exp;},0);return {monthly:monthly,catMap:catMap,totalInc:totalInc,totalExp:totalExp};}
function yoyCalcPct(a,b){if(!b||b===0)return null;return((a-b)/b)*100;}
function yoyPctColor(pct,isExpense){if(pct===null)return '#8A7060';if(isExpense)return pct>0?'#8B3020':'#4A7A3A';return pct>0?'#4A7A3A':'#8B3020';}
function yoyPctText(pct){if(pct===null)return '—';return(pct>0?'+':'')+pct.toFixed(1)+'%';}
function yoyRender(){var acc=_rpAcc||'home';var yearA=parseInt(document.getElementById('yoy-year-a').value);var yearB=parseInt(document.getElementById('yoy-year-b').value);var dA=yoyGetYearData(acc,yearA);var dB=yoyGetYearData(acc,yearB);document.getElementById('yoy-label-a').textContent='ปี '+(yearA+543);document.getElementById('yoy-label-b').textContent='ปี '+(yearB+543);document.getElementById('yoy-inc-a').textContent=fmt(dA.totalInc);document.getElementById('yoy-exp-a').textContent=fmt(dA.totalExp);document.getElementById('yoy-bal-a').textContent=fmt(dA.totalInc-dA.totalExp);document.getElementById('yoy-inc-b').textContent=fmt(dB.totalInc);document.getElementById('yoy-exp-b').textContent=fmt(dB.totalExp);document.getElementById('yoy-bal-b').textContent=fmt(dB.totalInc-dB.totalExp);var kpis=[{label:'รายรับ',pct:yoyCalcPct(dA.totalInc,dB.totalInc),isExp:false},{label:'รายจ่าย',pct:yoyCalcPct(dA.totalExp,dB.totalExp),isExp:true},{label:'คงเหลือ',pct:yoyCalcPct(dA.totalInc-dA.totalExp,dB.totalInc-dB.totalExp),isExp:false}];document.getElementById('yoy-kpi-strip').innerHTML=kpis.map(function(k){var arrow=k.pct===null?'—':(k.pct>0?'▲':'▼');var clr=yoyPctColor(k.pct,k.isExp);return '<div class="yoy-kpi-card"><div style="font-size:11px;color:#8A7A68;margin-bottom:4px;">'+k.label+'</div><div style="font-family:Mitr,sans-serif;font-size:18px;font-weight:600;color:'+clr+'!important;-webkit-text-fill-color:'+clr+'!important;">'+arrow+' '+yoyPctText(k.pct)+'</div><div style="font-size:10px;color:#8A7A68;margin-top:2px;">เทียบปีก่อน</div></div>';}).join('');if(yoyMChart)yoyMChart.destroy();yoyMChart=new Chart(document.getElementById('yoy-month-chart').getContext('2d'),{type:'line',data:{labels:MONTHS_SHORT,datasets:[{label:'รายรับ '+(yearA+543),data:dA.monthly.map(function(m){return m.inc;}),borderColor:'#4A7A3A',backgroundColor:'rgba(74,122,58,0.08)',borderWidth:2,pointRadius:3,tension:0.3,yAxisID:'yInc'},{label:'รายรับ '+(yearB+543),data:dB.monthly.map(function(m){return m.inc;}),borderColor:'#4A7A3A',backgroundColor:'transparent',borderWidth:2,borderDash:[5,4],pointRadius:3,tension:0.3,yAxisID:'yInc'},{label:'รายจ่าย '+(yearA+543),data:dA.monthly.map(function(m){return m.exp;}),borderColor:'#8B3020',backgroundColor:'rgba(139,48,32,0.08)',borderWidth:2,pointRadius:3,tension:0.3,yAxisID:'yExp'},{label:'รายจ่าย '+(yearB+543),data:dB.monthly.map(function(m){return m.exp;}),borderColor:'#8B3020',backgroundColor:'transparent',borderWidth:2,borderDash:[5,4],pointRadius:3,tension:0.3,yAxisID:'yExp'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:'Sarabun',size:11},boxWidth:10,padding:6}}},scales:{x:{grid:{display:false}},yInc:{position:'left',grid:{color:'#C8C0B0'},ticks:{callback:function(v){return v>=1000?(v/1000).toFixed(0)+'K':v;}},title:{display:true,text:'รายรับ',font:{family:'Sarabun',size:10},color:'#4A7A3A'}},yExp:{position:'right',grid:{drawOnChartArea:false},ticks:{callback:function(v){return v>=1000?(v/1000).toFixed(0)+'K':v;}},title:{display:true,text:'รายจ่าย',font:{family:'Sarabun',size:10},color:'#8B3020'}}}}});var allCats=Array.from(new Set(Object.keys(dA.catMap).concat(Object.keys(dB.catMap))));if(yoyCChart)yoyCChart.destroy();if(allCats.length){yoyCChart=new Chart(document.getElementById('yoy-cat-chart').getContext('2d'),{type:'bar',data:{labels:allCats,datasets:[{label:(yearA+543)+'',data:allCats.map(function(c){return dA.catMap[c]||0;}),backgroundColor:'rgba(139,48,32,0.80)',borderRadius:4},{label:(yearB+543)+'',data:allCats.map(function(c){return dB.catMap[c]||0;}),backgroundColor:'rgba(200,118,41,0.70)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{font:{family:'Sarabun',size:11},boxWidth:12,padding:8}}},scales:{x:{grid:{display:false},ticks:{font:{family:'Sarabun',size:10}}},y:{grid:{color:'#C8C0B0'},ticks:{callback:function(v){return v>=1000?(v/1000).toFixed(0)+'K':v;}}}}}})}var rows='<div class="yoy-table-header"><div class="yoy-col-label">เดือน</div><div class="yoy-col-inc" style="font-size:10px;">รายรับ '+(yearA+543)+'</div><div class="yoy-col-inc" style="font-size:10px;opacity:0.7;">รายรับ '+(yearB+543)+'</div><div class="yoy-col-exp" style="font-size:10px;">Δ รายรับ</div></div>';MONTHS_SHORT.forEach(function(mn,i){var mA=dA.monthly[i],mB=dB.monthly[i];var bg=i%2===0?'#FDFAF6':'#F5EFE6';var delta=mA.inc-mB.inc;var deltaClr=delta>=0?'#4A5E38':'#7A3020';rows+='<div class="yoy-table-row" style="background:'+bg+';"><div style="font-size:12px;font-family:Sarabun,sans-serif;color:#2A1A0E;font-weight:500;">'+mn+'</div><div style="font-size:12px;font-family:Mitr,sans-serif;color:#4A5E38!important;-webkit-text-fill-color:#4A5E38!important;text-align:right;">'+(mA.inc?fmt(mA.inc):'—')+'</div><div style="font-size:12px;font-family:Mitr,sans-serif;color:#4A5E38!important;-webkit-text-fill-color:#4A5E38!important;text-align:right;opacity:0.6;">'+(mB.inc?fmt(mB.inc):'—')+'</div><div style="font-size:12px;font-family:Mitr,sans-serif;color:'+deltaClr+'!important;-webkit-text-fill-color:'+deltaClr+'!important;text-align:right;">'+(mA.inc||mB.inc?(delta>=0?'+':'')+fmt(delta):'—')+'</div></div>';});var totalDelta=dA.totalInc-dB.totalInc;var totalDeltaClr=totalDelta>=0?'#4A5E38':'#7A3020';rows+='<div class="yoy-table-footer"><div class="yoy-col-label">รวม</div><div class="yoy-col-inc">'+fmt(dA.totalInc)+'</div><div class="yoy-col-inc" style="opacity:0.7;">'+fmt(dB.totalInc)+'</div><div style="font-size:12px;font-family:Mitr,sans-serif;font-weight:600;color:'+totalDeltaClr+'!important;-webkit-text-fill-color:'+totalDeltaClr+'!important;text-align:right;">'+(totalDelta>=0?'+':'')+fmt(totalDelta)+'</div></div>';document.getElementById('yoy-table').innerHTML=rows;}

  document.querySelectorAll('.modal-overlay').forEach(function(el){el.addEventListener('click',function(e){if(e.target===this){this.classList.remove('open');document.body.style.overflow='';}});});
  init();
  _doInitialLoad();
});
