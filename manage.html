<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>จัดการ — บัญชีครัวเรือน &amp; เกษตร</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#6C3212;--accent:#C87629;--bg:#F5EFE6;--surface:#FDFAF6;
  --border:#E0D5C4;--text:#2A1A0E;--text-sub:#8A7060;
  --shadow-sm:0 1px 6px rgba(61,35,20,0.10);--shadow:0 4px 20px rgba(61,35,20,0.13);--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:#F5EFE6!important;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;}

/* HEADER */
.app-header{background:#6C3212;color:#FAF0E6;padding:18px 20px 20px;position:sticky;top:0;z-index:100;border-radius:0 0 28px 28px;box-shadow:0 6px 24px rgba(61,35,20,0.22);}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.app-title{font-family:'Mitr',sans-serif;font-size:17px;font-weight:600;color:#FAF0E6!important;-webkit-text-fill-color:#FAF0E6!important;}

/* ACC TOGGLE — inside header */
.acc-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.acc-toggle-btn{padding:10px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.10);font-family:'Sarabun',sans-serif;font-size:14px;font-weight:500;cursor:pointer;color:rgba(250,240,230,0.6)!important;-webkit-text-fill-color:rgba(250,240,230,0.6)!important;transition:all 0.18s;}
.acc-toggle-btn.active{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.5);color:#FAF0E6!important;-webkit-text-fill-color:#FAF0E6!important;font-weight:600;}

/* TAB BAR — inside header */
.tab-bar{display:flex;background:rgba(0,0,0,0.20);border-radius:24px;padding:4px;gap:4px;border:1px solid rgba(255,255,255,0.12);margin-top:10px;}
.tab-btn{flex:1;padding:9px 4px;border:none;background:none;border-radius:20px;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:rgba(250,240,230,0.65)!important;-webkit-text-fill-color:rgba(250,240,230,0.65)!important;transition:all 0.18s;}
.tab-btn.active{background:rgba(255,255,255,0.18);color:#FAF0E6!important;-webkit-text-fill-color:#FAF0E6!important;font-weight:600;}

/* MAIN */
.main-content{padding:16px 15px 100px;}

/* CARDS */
.budget-card{background:var(--surface);border-radius:var(--r);padding:15px;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform 0.12s;}
.budget-card:active{transform:scale(0.98);}
.budget-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.budget-name{font-size:14px;font-weight:600;color:#1A1208!important;-webkit-text-fill-color:#1A1208!important;}
.budget-amounts{font-family:'Mitr',sans-serif;font-size:12px;color:#8A7060!important;-webkit-text-fill-color:#8A7060!important;}
.budget-bar{height:8px;background:#E8DDD0;border-radius:4px;overflow:hidden;margin-bottom:6px;}
.budget-fill{height:100%;border-radius:3px;background:#6C3212;transition:width 0.5s ease;}
.budget-fill.warn{background:#C87629;}
.budget-fill.over{background:#7A3020;}
.budget-foot{display:flex;justify-content:space-between;align-items:center;}
.budget-pct{font-size:11px;color:#8A7A68!important;-webkit-text-fill-color:#8A7A68!important;}

.debt-card{background:var(--surface);border-radius:var(--r);padding:15px 16px;margin-bottom:10px;border:1px solid var(--border);border-left:4px solid #9C4722;box-shadow:var(--shadow-sm);cursor:pointer;}
.debt-card.farm-debt{border-left-color:#C87629;}
.debt-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.debt-name{font-size:14px;font-weight:600;color:#1A1208!important;-webkit-text-fill-color:#1A1208!important;}
.debt-badge{font-size:10px;padding:2px 8px;border-radius:8px;white-space:nowrap;}
.debt-badge.home{background:#F0E4D8;color:#7A3020!important;-webkit-text-fill-color:#7A3020!important;}
.debt-badge.farm{background:#E8F0D8;color:#3A6020!important;-webkit-text-fill-color:#3A6020!important;}
.debt-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.debt-stat{text-align:center;background:#F5EFE6;border-radius:8px;padding:7px 4px;}
.debt-stat-label{font-size:10px;color:#8A7A68!important;-webkit-text-fill-color:#8A7A68!important;margin-bottom:2px;}
.debt-stat-value{font-family:'Mitr',sans-serif;font-size:13px;font-weight:600;color:#2A1A0E!important;-webkit-text-fill-color:#2A1A0E!important;}
.debt-stat-value.red{color:#8B3020!important;-webkit-text-fill-color:#8B3020!important;}
.debt-progress-wrap{margin-bottom:8px;}
.debt-progress-labels{display:flex;justify-content:space-between;font-size:10px;color:#8A7A68;margin-bottom:3px;}
.debt-progress-bar{height:6px;background:#E8E0D4;border-radius:3px;overflow:hidden;}
.debt-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#4A7A3A,#7AC06A);transition:width 0.4s;}
.debt-due{font-size:11px;margin-top:4px;}
.debt-due.ok{color:#8A7A68!important;-webkit-text-fill-color:#8A7A68!important;}
.debt-due.soon{color:#C87629!important;-webkit-text-fill-color:#C87629!important;}
.debt-due.overdue{color:#C84030!important;-webkit-text-fill-color:#C84030!important;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#FDFAF6;border-top:1px solid #E0D5C4;display:flex;z-index:200;box-shadow:0 -4px 24px rgba(61,35,20,0.12);padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-btn{flex:1;padding:10px 4px 14px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A7A68!important;-webkit-text-fill-color:#8A7A68!important;font-family:'Sarabun',sans-serif;}
.nav-btn.active{color:#6C3212!important;-webkit-text-fill-color:#6C3212!important;}
.nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.nav-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-label{font-size:10px;font-weight:500;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9000;display:none;flex-direction:column;justify-content:flex-end;align-items:center;pointer-events:none;}
.modal-overlay.open{display:flex;pointer-events:all;}
.modal-sheet{background:#EDE7DB;border-radius:28px 28px 0 0;width:100%;max-width:480px;max-height:90vh;padding:20px 24px;padding-bottom:max(52px,calc(32px + env(safe-area-inset-bottom,0px)));overflow-y:auto;animation:slideUp 0.25s ease;box-shadow:0 -4px 32px rgba(61,35,20,0.18);flex-shrink:0;}
@keyframes slideUp{from{transform:translateY(100%);opacity:0.5;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.modal-title{font-family:'Mitr',sans-serif;font-size:17px;font-weight:600;margin-bottom:18px;text-align:center;color:var(--text);}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:12px;font-weight:600;letter-spacing:0.4px;color:#6A5848!important;-webkit-text-fill-color:#6A5848!important;margin-bottom:6px;text-transform:uppercase;}
.form-control{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;font-family:'Sarabun',sans-serif;font-size:16px;color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;background:#F8F4EE;outline:none;-webkit-appearance:none;box-sizing:border-box;}
.form-control:focus{border-color:#6C3212;}
.btn-primary{width:100%;padding:14px;border:none;border-radius:14px;background:#6C3212;color:#FAF0E6!important;-webkit-text-fill-color:#FAF0E6!important;font-family:'Mitr',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:transform 0.15s;box-shadow:0 4px 16px rgba(61,35,20,0.30);}
.btn-primary:active{transform:scale(0.97);}
.btn-ghost{width:100%;padding:12px;border:none;background:none;color:#6A5E4E!important;-webkit-text-fill-color:#6A5E4E!important;font-family:'Sarabun',sans-serif;font-size:14px;cursor:pointer;margin-top:4px;}
.btn-danger{width:100%;padding:13px;border-radius:12px;border:1.5px solid #C84030;background:none;font-family:'Sarabun',sans-serif;font-size:15px;font-weight:600;cursor:pointer;color:#C84030!important;-webkit-text-fill-color:#C84030!important;margin-top:8px;}
.no-item{background:#E5DFD2;border-radius:var(--r);padding:14px 16px;text-align:center;color:#8A7A68!important;-webkit-text-fill-color:#8A7A68!important;font-size:13px;border:1px solid var(--border);}
.action-btn{font-size:13px;font-weight:500;color:#3D2314!important;-webkit-text-fill-color:#3D2314!important;background:#E8E3D8;border:1px solid #D2C9B8;border-radius:8px;padding:5px 12px;cursor:pointer;font-family:'Sarabun',sans-serif;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
select option{background:#EDE7DB;color:#1A1208;}
input,select,textarea{color:#1A1208!important;-webkit-text-fill-color:#1A1208!important;}
::placeholder{color:#A89070!important;}
::-webkit-input-placeholder{color:#A89070!important;-webkit-text-fill-color:#A89070!important;}
</style>
</head>
<body>

<div class="app-header">
  <div class="header-row">
    <div class="app-title">จัดการงบ &amp; สินเชื่อ</div>
  </div>
  <div class="acc-toggle">
    <button class="acc-toggle-btn active" id="btoggle-home" onclick="setBudgetAcc('home')">ครัวเรือน</button>
    <button class="acc-toggle-btn" id="btoggle-farm" onclick="setBudgetAcc('farm')">การเกษตร</button>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-budget" onclick="switchTab('budget')">งบประมาณ</button>
    <button class="tab-btn" id="tab-debt" onclick="switchTab('debt')">สินเชื่อ</button>
  </div>
</div>

<div class="main-content">

  <div id="panel-budget">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;margin-top:4px;">
      <span id="budget-month-label" style="font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;color:#4A3020!important;-webkit-text-fill-color:#4A3020!important;"></span>
      <button class="action-btn" onclick="openAddBudget()">+ เพิ่มงบ</button>
    </div>
    <div id="budget-list"></div>
  </div>

  <div id="panel-debt" style="display:none;">
    <div id="debt-summary" style="background:#FFF8F4;border:1px solid #E8D8CC;border-radius:16px;padding:14px 16px;margin-bottom:14px;"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-family:'Mitr',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.8px;text-transform:uppercase;color:#8A7A68!important;-webkit-text-fill-color:#8A7A68!important;">รายการสินเชื่อ</span>
      <button class="action-btn" onclick="openAddDebt()">+ เพิ่ม</button>
    </div>
    <div id="debt-list"></div>
  </div>

</div>

<!-- MODAL: งบประมาณ -->
<div class="modal-overlay" id="modal-budget">
  <div class="modal-sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <div class="modal-title" id="budget-modal-title" style="margin:0;">ตั้งงบประมาณ</div>
      <button onclick="closeModal('modal-budget')" style="width:32px;height:32px;border-radius:50%;background:#E8E0D4;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6A5848;flex-shrink:0;">&#x2715;</button>
    </div>
    <div class="form-group">
      <label class="form-label">หมวดหมู่รายจ่าย</label>
      <select class="form-control" id="budget-category"><option value="">— เลือกหมวดหมู่ —</option></select>
    </div>
    <div class="form-group">
      <label class="form-label">วงเงินงบประมาณ (บาท/เดือน)</label>
      <input type="number" class="form-control" id="budget-amount" placeholder="0.00" inputmode="decimal" style="font-size:18px;font-weight:600;background:#F0EBE1;">
    </div>
    <div class="form-group">
      <label class="form-label">เดือน</label>
      <input type="month" class="form-control" id="budget-month">
    </div>
    <button class="btn-primary" onclick="saveBudget()">บันทึกงบประมาณ</button>
  </div>
</div>

<!-- MODAL: สินเชื่อ -->
<div class="modal-overlay" id="modal-debt">
  <div class="modal-sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <div class="modal-title" id="debt-modal-title" style="margin:0;">เพิ่มสินเชื่อ</div>
      <button onclick="closeModal('modal-debt')" style="width:32px;height:32px;border-radius:50%;background:#E8E0D4;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6A5848;flex-shrink:0;">&#x2715;</button>
    </div>

    <!-- สถาบันการเงิน -->
    <div class="form-group">
      <label class="form-label">สถาบันการเงิน / เจ้าหนี้</label>
      <select class="form-control" id="debt-institution" onchange="debtInstChange(this.value)">
        <option value="">— เลือกสถาบัน —</option>
        <optgroup label="ธนาคารรัฐ">
          <option>ธนาคารกรุงไทย (KTB)</option>
          <option>ธนาคารออมสิน (GSB)</option>
          <option>ธนาคารเพื่อการเกษตรและสหกรณ์ (ธ.ก.ส.)</option>
          <option>ธนาคารอาคารสงเคราะห์ (ธอส.)</option>
          <option>ธนาคารพัฒนาวิสาหกิจขนาดกลางและขนาดย่อม (SME D Bank)</option>
          <option>ธนาคารเพื่อการส่งออกและนำเข้า (EXIM)</option>
          <option>กยศ. (กองทุนเงินให้กู้ยืมเพื่อการศึกษา)</option>
        </optgroup>
        <optgroup label="ธนาคารพาณิชย์">
          <option>ธนาคารกสิกรไทย (KBANK)</option>
          <option>ธนาคารไทยพาณิชย์ (SCB)</option>
          <option>ธนาคารกรุงเทพ (BBL)</option>
          <option>ธนาคารกรุงศรีอยุธยา (BAY)</option>
          <option>ธนาคารทหารไทยธนชาต (TTB)</option>
          <option>ธนาคารยูโอบี (UOB)</option>
          <option>ธนาคารซีไอเอ็มบี (CIMB)</option>
          <option>ธนาคารแลนด์ แอนด์ เฮ้าส์ (LH Bank)</option>
          <option>ธนาคารทิสโก้ (TISCO)</option>
          <option>ธนาคารเกียรตินาคินภัทร (KKP)</option>
        </optgroup>
        <optgroup label="บัตรเครดิต / สินเชื่อส่วนบุคคล">
          <option>KTC (บัตรเครดิต/สินเชื่อ)</option>
          <option>AEON (อิออน)</option>
          <option>Central Card / Central The 1</option>
          <option>Krungsri First Choice</option>
          <option>SCB มันนี่</option>
          <option>กสิกร พี่เบิ้ม</option>
        </optgroup>
        <optgroup label="ไฟแนนซ์ / ลิสซิ่ง">
          <option>Toyota Leasing (TLT)</option>
          <option>Honda Leasing</option>
          <option>Nissan Financial Services</option>
          <option>Isuzu Leasing</option>
          <option>Kiatnakin Phatra (KKP Leasing)</option>
          <option>Tisco Leasing</option>
          <option>SCB Leasing</option>
          <option>Ayudhya Capital</option>
          <option>ลิสซิ่งรถไถ / เครื่องจักรเกษตร</option>
        </optgroup>
        <optgroup label="สินเชื่อนาโน / ไมโครไฟแนนซ์">
          <option>Ngern Tid Lor (เงินติดล้อ)</option>
          <option>MONEYMAN</option>
          <option>ศรีสวัสดิ์ (Sri Sawad)</option>
          <option>Muangthai Capital (MTC)</option>
          <option>SAWAD</option>
        </optgroup>
        <optgroup label="สถาบันชุมชน">
          <option>กองทุนหมู่บ้าน</option>
          <option>สหกรณ์การเกษตร</option>
          <option>สหกรณ์ออมทรัพย์</option>
          <option>กลุ่มออมทรัพย์ชุมชน</option>
        </optgroup>
        <optgroup label="กู้นอกระบบ / ส่วนตัว">
          <option>กู้พี่น้อง / ครอบครัว (ไม่มีดอกเบี้ย)</option>
          <option>กู้พี่น้อง / ครอบครัว (มีดอกเบี้ย)</option>
          <option>กู้เพื่อน / คนรู้จัก</option>
          <option>เจ้าหนี้นอกระบบ</option>
        </optgroup>
        <optgroup label="อื่นๆ">
          <option value="__custom__">ระบุเอง...</option>
        </optgroup>
      </select>
    </div>
    <div class="form-group" id="debt-inst-custom-wrap" style="display:none;">
      <label class="form-label">ระบุชื่อสถาบัน / เจ้าหนี้</label>
      <input type="text" class="form-control" id="debt-inst-custom" placeholder="เช่น สหกรณ์ XXX, นายสมชาย">
    </div>

    <!-- ประเภทสินเชื่อ -->
    <div class="form-group">
      <label class="form-label">ประเภทสินเชื่อ</label>
      <select class="form-control" id="debt-type">
        <option value="">— เลือกประเภท —</option>
        <option>สินเชื่อบ้าน / ที่ดิน</option>
        <option>สินเชื่อรถยนต์ / จักรยานยนต์</option>
        <option>สินเชื่อรถไถ / เครื่องจักรเกษตร</option>
        <option>สินเชื่อส่วนบุคคล (Personal Loan)</option>
        <option>บัตรเครดิต</option>
        <option>สินเชื่อการเกษตร (ธ.ก.ส.)</option>
        <option>สินเชื่อธุรกิจ / SME</option>
        <option>สินเชื่อการศึกษา (กยศ.)</option>
        <option>สินเชื่อนาโน / ไมโครไฟแนนซ์</option>
        <option>กู้ส่วนตัว (ไม่มีดอกเบี้ย)</option>
        <option>กู้ส่วนตัว (มีดอกเบี้ย)</option>
        <option>อื่นๆ</option>
      </select>
    </div>

    <!-- ยอดสินเชื่อทั้งหมด (มาก่อน) -->
    <div class="form-group">
      <label class="form-label">ยอดสินเชื่อทั้งหมด (฿)</label>
      <input type="number" class="form-control" id="debt-original" placeholder="0" inputmode="decimal" style="font-size:18px;font-weight:600;background:#F0EBE1;">
    </div>
    <!-- ยอดสินเชื่อคงเหลือ -->
    <div class="form-group">
      <label class="form-label">ยอดสินเชื่อคงเหลือ (฿)</label>
      <input type="number" class="form-control" id="debt-total" placeholder="0" inputmode="decimal">
    </div>

    <!-- ดอกเบี้ย -->
    <div class="two-col">
      <div class="form-group">
        <label class="form-label">ดอกเบี้ย (% ต่อปี)</label>
        <input type="number" class="form-control" id="debt-interest-rate" placeholder="0.00" inputmode="decimal" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">ประเภทดอกเบี้ย</label>
        <select class="form-control" id="debt-interest-type">
          <option value="">— เลือก —</option>
          <option>ดอกเบี้ยคงที่ (Flat Rate)</option>
          <option>ดอกเบี้ยลดต้นลดดอก (Effective Rate)</option>
          <option>ดอกเบี้ยรายวัน</option>

<script>
var MONTHS_TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var CATEGORIES={
  home:{
    income:['เงินเดือน','โบนัส','ค่าตอบแทนพิเศษ','ค่าเช่า','รายได้จากทรัพย์สิน','ดอกเบี้ย','เงินปันผล','รายได้อิสระ / ฟรีแลนซ์','ขายสินค้า','อื่นๆ'],
    expense:['อาหาร','เครื่องดื่ม','เดินทาง','น้ำมันรถ','ค่าไฟฟ้า','ค่าน้ำประปา','อินเทอร์เน็ต / โทรศัพท์','ช้อปปิ้ง','ของใช้ในบ้าน','สุขภาพ','ยา','ค่าพยาบาล','บันเทิง','ท่องเที่ยว','การศึกษา','ซ่อมบำรุงบ้าน','ซ่อมบำรุงรถ','ผ่อนชำระสินเชื่อ','อื่นๆ']
  },
  farm:{
    income:['ขายพืชผล','เงินอุดหนุนจากรัฐ','รายได้อื่นๆ'],
    expense:['เมล็ดพันธุ์','กล้าไม้','ปุ๋ยเคมี','ปุ๋ยอินทรีย์','ปุ๋ยชีวภาพ','ยาฆ่าแมลง','สารกำจัดศัตรูพืช','ยาฆ่าหญ้า','สารเคมีทางการเกษตร','น้ำมันเชื้อเพลิง','ค่าไฟสูบน้ำ','ค่าแรงงาน','จ้างเก็บเกี่ยว','อุปกรณ์การเกษตร','เครื่องมือการเกษตร','ซ่อมบำรุงเครื่องจักร','ซ่อมบำรุงรถไถ','ค่าเช่าที่ดิน','ค่าเช่าเครื่องจักร','ค่าน้ำ','ระบบชลประทาน','ค่าขนส่ง','บรรจุภัณฑ์','ค่าประกันภัยพืชผล','อื่นๆ']
  }
};
var FARM_EXPENSE_GROUPS=[
  {group:'เมล็ด / กล้า', items:['เมล็ดพันธุ์','กล้าไม้']},
  {group:'ปุ๋ย', items:['ปุ๋ยเคมี','ปุ๋ยอินทรีย์','ปุ๋ยชีวภาพ']},
  {group:'ยา / สารเคมี', items:['ยาฆ่าแมลง','สารกำจัดศัตรูพืช','ยาฆ่าหญ้า','สารเคมีทางการเกษตร']},
  {group:'เชื้อเพลิง / ไฟฟ้า', items:['น้ำมันเชื้อเพลิง','ค่าไฟสูบน้ำ']},
  {group:'แรงงาน', items:['ค่าแรงงาน','จ้างเก็บเกี่ยว']},
  {group:'อุปกรณ์ / เครื่องจักร', items:['อุปกรณ์การเกษตร','เครื่องมือการเกษตร','ซ่อมบำรุงเครื่องจักร','ซ่อมบำรุงรถไถ']},
  {group:'ค่าเช่า', items:['ค่าเช่าที่ดิน','ค่าเช่าเครื่องจักร']},
  {group:'น้ำ / ชลประทาน', items:['ค่าน้ำ','ระบบชลประทาน']},
  {group:'ขนส่ง / บรรจุภัณฑ์', items:['ค่าขนส่ง','บรรจุภัณฑ์']},
  {group:'อื่นๆ', items:['ค่าประกันภัยพืชผล','อื่นๆ']}
];
// aliases สำหรับ backward compat
var CATS_HOME_EXP=CATEGORIES.home.expense;
var CATS_FARM_EXP=CATEGORIES.farm.expense;

var _EMPTY_DATA=function(){return{home:{transactions:[],budgets:[],debts:[]},farm:{transactions:[],budgets:[],debts:[]}};};
var DATA=(function(){
  try{var r=localStorage.getItem('banharnData');return r?JSON.parse(r):_EMPTY_DATA();}catch(e){return _EMPTY_DATA();}
})();
localStorage.removeItem('gasUrl'); // ล้างค่าเก่า ไม่ต้องการแล้ว

var GAS_URL = 'https://script.google.com/macros/s/AKfycbzmVePBscvTiDxZVyh6Ba4ovAo-t-UFw5HkyU9HNn3qfmf_t3RrtKmCvmZ4DD9KjjOs/exec';
var _gasUrl = GAS_URL || localStorage.getItem('gasUrl') || '';
var _syncStatus='idle';
var _pushTimer=null;
var _isOnline=navigator.onLine;

function saveData(){
  localStorage.setItem('banharnData',JSON.stringify(DATA));
  clearTimeout(_pushTimer);
  _pushTimer=setTimeout(_doPush,800);
}

function _doPush(){
  if(!_gasUrl||!_isOnline)return;
  fetch(_gasUrl,{
    method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'sync',data:JSON.stringify(DATA)})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.status==='ok'&&d.home&&d.farm){
      DATA.home=d.home;DATA.farm=d.farm;
      localStorage.setItem('banharnData',JSON.stringify(DATA));
      renderBudget();renderDebt();
      showToast('Sync แล้ว ✓');
    }
  })
  .catch(function(){/* ออฟไลน์ */});
}

function _doInitialLoad(){
  if(!_gasUrl)return;
  fetch(_gasUrl+'?action=pull',{redirect:'follow'})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.status==='ok'&&d.home&&d.farm){
      DATA.home=d.home;DATA.farm=d.farm;
      localStorage.setItem('banharnData',JSON.stringify(DATA));
      renderBudget();renderDebt();
    }
  })
  .catch(function(){});
}

window.addEventListener('online',function(){_isOnline=true;_doPush();});
window.addEventListener('offline',function(){_isOnline=false;});
function fmt(n){return (parseFloat(n)||0).toLocaleString('th-TH');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatDateTH(str){if(!str)return '-';var p=str.split('-');return parseInt(p[2])+' '+MONTHS_TH[parseInt(p[1])-1]+' '+(parseInt(p[0])+543);}
function openModal(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';}
function closeModal(id){document.getElementById(id).classList.remove('open');document.body.style.overflow='';}
function showToast(msg){
  var t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.style.cssText='position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#6C3212;color:#FAF0E6;padding:9px 18px;border-radius:8px;font-family:Sarabun,sans-serif;font-size:13px;z-index:9999;transition:opacity 0.3s;white-space:nowrap;pointer-events:none;';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._tid);t._tid=setTimeout(function(){t.style.opacity='0';},2500);
}

var _tab='budget',_acc='home',_editDebtAcc='',_editDebtId='';

function switchTab(tab){
  _tab=tab;
  document.getElementById('tab-budget').className='tab-btn'+(tab==='budget'?' active':'');
  document.getElementById('tab-debt').className='tab-btn'+(tab==='debt'?' active':'');
  document.getElementById('panel-budget').style.display=tab==='budget'?'block':'none';
  document.getElementById('panel-debt').style.display=tab==='debt'?'block':'none';
  if(tab==='budget')renderBudget();else renderDebt();
}

function setBudgetAcc(acc){
  _acc=acc;
  document.getElementById('btoggle-home').className='acc-toggle-btn'+(acc==='home'?' active':'');
  document.getElementById('btoggle-farm').className='acc-toggle-btn'+(acc==='farm'?' active':'');
  if(_tab==='budget')renderBudget();
}

/* ===== BUDGET ===== */
function renderBudget(){
  var now=new Date(),m=now.getMonth(),y=now.getFullYear();
  var monthStr=y+'-'+String(m+1).padStart(2,'0');
  document.getElementById('budget-month-label').textContent=MONTHS_TH[m]+' '+(y+543);
  var budgets=DATA[_acc].budgets.filter(function(b){return b.month===monthStr;});
  var el=document.getElementById('budget-list');
  if(!budgets.length){el.innerHTML='<div class="no-item">ยังไม่มีงบประมาณเดือนนี้<br><small>กด + เพิ่มงบ เพื่อตั้งงบประมาณ</small></div>';return;}
  var txList=DATA[_acc].transactions.filter(function(t){var d=new Date(t.date);return d.getMonth()===m&&d.getFullYear()===y&&t.type==='expense';});
  var spent={};txList.forEach(function(t){spent[t.category]=(spent[t.category]||0)+t.amount;});
  el.innerHTML=budgets.map(function(b){
    var s=spent[b.category]||0,pct=b.amount>0?Math.min(Math.round(s/b.amount*100),100):0;
    var fillCls=pct>=100?'over':pct>=75?'warn':'';
    return '<div class="budget-card" onclick="openEditBudget(\''+b.id+'\')">'
      +'<div class="budget-header"><span class="budget-name">'+b.category+'</span><span class="budget-amounts">'+fmt(s)+' / '+fmt(b.amount)+' ฿</span></div>'
      +'<div class="budget-bar"><div class="budget-fill '+fillCls+'" style="width:'+pct+'%"></div></div>'
      +'<div class="budget-foot"><span class="budget-pct">ใช้ไปแล้ว '+pct+'%</span></div>'
      +'</div>';
  }).join('');
}

function _buildBudgetCatOptions(selectedCat){
  var def='<option value="">— เลือกหมวดหมู่ —</option>';
  if(_acc==='home'){
    return def+CATEGORIES.home.expense.map(function(c){
      return '<option'+(c===selectedCat?' selected':'')+'>'+c+'</option>';
    }).join('');
  } else {
    return def+FARM_EXPENSE_GROUPS.map(function(g){
      return '<optgroup label="'+g.group+'">'
        +g.items.map(function(c){return '<option'+(c===selectedCat?' selected':'')+'>'+c+'</option>';}).join('')
        +'</optgroup>';
    }).join('');
  }
}

function openAddBudget(){
  document.getElementById('budget-modal-title').textContent='ตั้งงบประมาณ — '+(_acc==='home'?'ครัวเรือน':'เกษตร');
  document.getElementById('budget-category').innerHTML=_buildBudgetCatOptions('');
  var now=new Date();document.getElementById('budget-month').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('budget-amount').value='';
  openModal('modal-budget');
}

function openEditBudget(id){
  var b=null;DATA[_acc].budgets.forEach(function(x){if(x.id===id)b=x;});if(!b)return;
  document.getElementById('budget-modal-title').textContent='แก้ไขงบประมาณ';
  document.getElementById('budget-category').innerHTML=_buildBudgetCatOptions(b.category);
  document.getElementById('budget-amount').value=b.amount;
  document.getElementById('budget-month').value=b.month;
  openModal('modal-budget');
}

function saveBudget(){
  var cat=document.getElementById('budget-category').value;
  var amt=parseFloat(document.getElementById('budget-amount').value);
  var month=document.getElementById('budget-month').value;
  if(!amt||amt<=0){alert('กรุณาระบุวงเงิน');return;}
  var existing=null;DATA[_acc].budgets.forEach(function(b){if(b.category===cat&&b.month===month)existing=b;});
  if(existing){existing.amount=amt;}else{DATA[_acc].budgets.push({id:Date.now()+'',category:cat,amount:amt,month:month});}
  saveData();closeModal('modal-budget');renderBudget();showToast('บันทึกงบประมาณแล้ว');
}

/* ===== DEBT ===== */
function renderDebt(){
  var allDebts=[];
  ['home','farm'].forEach(function(a){DATA[a].debts.forEach(function(d){allDebts.push({acc:a,data:d});});});
  var sumEl=document.getElementById('debt-summary');
  var el=document.getElementById('debt-list');
  if(!allDebts.length){
    sumEl.innerHTML='<div style="text-align:center;color:#8A7A68!important;-webkit-text-fill-color:#8A7A68!important;font-size:13px;">ยังไม่มีสินเชื่อ</div>';
    el.innerHTML='<div class="no-item">ยังไม่มีรายการสินเชื่อ<br><small>กด + เพิ่ม เพื่อเพิ่มสินเชื่อ</small></div>';
    return;
  }
  var totOrig=allDebts.reduce(function(s,x){return s+(x.data.originalTotal||x.data.total);},0);
  var totRem=allDebts.reduce(function(s,x){return s+x.data.total;},0);
  var totPaid=totOrig-totRem;
  var pct=totOrig>0?Math.min(Math.round(totPaid/totOrig*100),100):0;
  var totInst=allDebts.reduce(function(s,x){return s+(x.data.installment||0);},0);
  sumEl.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;">'
    +'<div style="text-align:center;"><div style="font-size:10px;color:#8A7A68;margin-bottom:2px;">ยอดสินเชื่อรวม</div><div style="font-family:Mitr,sans-serif;font-size:14px;font-weight:600;color:#2A1A0E;">'+fmt(totOrig)+'</div></div>'
    +'<div style="text-align:center;"><div style="font-size:10px;color:#8A7A68;margin-bottom:2px;">คงเหลือ</div><div style="font-family:Mitr,sans-serif;font-size:14px;font-weight:600;color:#8B3020;">'+fmt(totRem)+'</div></div>'
    +'<div style="text-align:center;"><div style="font-size:10px;color:#8A7A68;margin-bottom:2px;">งวด/เดือน</div><div style="font-family:Mitr,sans-serif;font-size:14px;font-weight:600;color:#4A7A3A;">'+fmt(totInst)+'</div></div>'
    +'</div>'
    +'<div style="font-size:10px;color:#8A7A68;margin-bottom:4px;">ชำระแล้ว '+pct+'%</div>'
    +'<div style="background:#E8E0D4;border-radius:4px;height:6px;"><div style="background:linear-gradient(90deg,#4A7A3A,#7AC06A);border-radius:4px;height:6px;width:'+pct+'%;transition:width 0.4s;"></div></div>';
  var today=new Date();today.setHours(0,0,0,0);
  el.innerHTML=allDebts.map(function(x){
    var d=x.data;
    var due=d.nextDue?new Date(d.nextDue):null;if(due)due.setHours(0,0,0,0);
    var diff=due?Math.round((due-today)/86400000):null;
    var overdue=diff!==null&&diff<0,urgent=diff!==null&&diff<=7&&diff>=0;
    var orig=d.originalTotal||d.total,ppct=orig>0?Math.min(Math.round((orig-d.total)/orig*100),100):0;
    var dueCls=overdue?'overdue':urgent?'soon':'ok';
    var dueTxt=diff===null?'':overdue?'⚠ เกินกำหนด '+Math.abs(diff)+' วัน':diff===0?'⏰ ครบกำหนดวันนี้':urgent?'⏰ อีก '+diff+' วัน':'งวดถัดไป: '+formatDateTH(d.nextDue);
    var cardCls='debt-card'+(x.acc==='farm'?' farm-debt':'');
    // interest info
    var intTxt='';
    if(d.interestRate){intTxt=d.interestRate+'%/ปี'+(d.interestType?' · '+d.interestType:'');}
    else if(d.interestType){intTxt=d.interestType;}
    // paid count
    var paidTxt='';
    if(d.paidCount){paidTxt='จ่ายแล้ว '+d.paidCount+' งวด'+(d.installment?' ('+fmt(d.paidCount*d.installment)+' ฿)':'');}
    if(d.extraPaid&&d.extraPaid>0){paidTxt+=(paidTxt?' · ':'')+'โปะเพิ่ม '+fmt(d.extraPaid)+' ฿';}
    return '<div class="'+cardCls+'" onclick="openEditDebt(\''+x.acc+'\',\''+d.id+'\')">'
      +'<div class="debt-header">'
        +'<div class="debt-name">'+d.name+(d.debtType?'<br><small style="font-weight:400;font-size:11px;color:#8A7A68;">'+d.debtType+'</small>':'')+'</div>'
        +'<span class="debt-badge '+(x.acc==='home'?'home':'farm')+'">'+(x.acc==='home'?'ครัวเรือน':'เกษตร')+'</span>'
      +'</div>'
      +(intTxt?'<div style="font-size:11px;color:#6A5848;margin-bottom:6px;">💰 ดอกเบี้ย: '+intTxt+'</div>':'')
      +'<div class="debt-grid">'
        +'<div class="debt-stat"><div class="debt-stat-label">ยอดสินเชื่อ</div><div class="debt-stat-value">'+fmt(orig)+'</div></div>'
        +'<div class="debt-stat"><div class="debt-stat-label">คงเหลือ</div><div class="debt-stat-value red">'+fmt(d.total)+'</div></div>'
        +'<div class="debt-stat"><div class="debt-stat-label">งวด/เดือน</div><div class="debt-stat-value">'+fmt(d.installment||0)+'</div></div>'
      +'</div>'
      +'<div class="debt-progress-wrap">'
        +'<div class="debt-progress-labels"><span>ชำระแล้ว '+ppct+'%</span><span>'+fmt(orig-d.total)+' ฿</span></div>'
        +'<div class="debt-progress-bar"><div class="debt-progress-fill" style="width:'+ppct+'%"></div></div>'
      +'</div>'
      +(paidTxt?'<div style="font-size:11px;color:#6A5848;margin-top:4px;">'+paidTxt+'</div>':'')
      +(d.nextDue?'<div class="debt-due '+dueCls+'">'+dueTxt+'</div>':'')
      +'</div>';
  }).join('');
}

function debtInstChange(val){
  document.getElementById('debt-inst-custom-wrap').style.display=val==='__custom__'?'block':'none';
}

function _debtName(){
  var inst=document.getElementById('debt-institution').value;
  var custom=document.getElementById('debt-inst-custom').value.trim();
  var typeEl=document.getElementById('debt-type');
  var debtType=typeEl&&typeEl.value?typeEl.options[typeEl.selectedIndex].text:'';
  var base=inst==='__custom__'?(custom||'ระบุเอง'):inst;
  return {base:base,debtType:debtType,name:base+(debtType?' ('+debtType+')':'')};
}

function openAddDebt(){
  _editDebtAcc='';_editDebtId='';
  document.getElementById('debt-modal-title').textContent='เพิ่มสินเชื่อ';
  document.getElementById('debt-institution').value='';
  document.getElementById('debt-inst-custom').value='';
  document.getElementById('debt-inst-custom-wrap').style.display='none';
  document.getElementById('debt-type').selectedIndex=0;
  document.getElementById('debt-original').value='';
  document.getElementById('debt-total').value='';
  document.getElementById('debt-interest-rate').value='';
  document.getElementById('debt-interest-type').value='';
  document.getElementById('debt-installment').value='';
  document.getElementById('debt-paid-count').value='';
  document.getElementById('debt-extra-paid').value='';
  document.getElementById('debt-nextdue').value=todayStr();
  document.getElementById('debt-note').value='';
  document.getElementById('btn-delete-debt').style.display='none';
  openModal('modal-debt');
}

function openEditDebt(acc,id){
  var d=null;DATA[acc].debts.forEach(function(x){if(x.id===id)d=x;});if(!d)return;
  _editDebtAcc=acc;_editDebtId=id;
  document.getElementById('debt-modal-title').textContent='แก้ไขสินเชื่อ';
  // institution
  var instEl=document.getElementById('debt-institution');
  var instVal=d.institution||'';
  var found=false;
  for(var i=0;i<instEl.options.length;i++){
    if(instEl.options[i].text===instVal||instEl.options[i].value===instVal){instEl.selectedIndex=i;found=true;break;}
  }
  if(!found&&instVal){instEl.value='__custom__';document.getElementById('debt-inst-custom').value=instVal;document.getElementById('debt-inst-custom-wrap').style.display='block';}
  else{document.getElementById('debt-inst-custom-wrap').style.display='none';}
  // type
  var typeEl=document.getElementById('debt-type');
  var typeVal=d.debtType||'';
  typeEl.value='';
  for(var j=0;j<typeEl.options.length;j++){if(typeEl.options[j].text===typeVal){typeEl.selectedIndex=j;break;}}
  document.getElementById('debt-original').value=d.originalTotal||d.total||'';
  document.getElementById('debt-total').value=d.total||'';
  document.getElementById('debt-interest-rate').value=d.interestRate||'';
  document.getElementById('debt-interest-type').value=d.interestType||'';
  document.getElementById('debt-installment').value=d.installment||'';
  document.getElementById('debt-paid-count').value=d.paidCount||'';
  document.getElementById('debt-extra-paid').value=d.extraPaid||'';
  document.getElementById('debt-nextdue').value=d.nextDue||'';
  document.getElementById('debt-note').value=d.note||'';
  document.getElementById('btn-delete-debt').style.display='block';
  openModal('modal-debt');
}

function saveDebt(){
  var inst=document.getElementById('debt-institution').value;
  if(inst==='__custom__')inst=document.getElementById('debt-inst-custom').value.trim();
  if(!inst){alert('กรุณาเลือกหรือระบุสถาบัน / เจ้าหนี้');return;}
  var typeEl=document.getElementById('debt-type');
  var debtType=typeEl&&typeEl.value?typeEl.value:'';
  var orig=parseFloat(document.getElementById('debt-original').value)||0;
  var total=parseFloat(document.getElementById('debt-total').value)||orig;
  var interestRate=parseFloat(document.getElementById('debt-interest-rate').value)||0;
  var interestType=document.getElementById('debt-interest-type').value||'';
  var install=parseFloat(document.getElementById('debt-installment').value)||0;
  var paidCount=parseInt(document.getElementById('debt-paid-count').value)||0;
  var extraPaid=parseFloat(document.getElementById('debt-extra-paid').value)||0;
  var nextDue=document.getElementById('debt-nextdue').value;
  var note=document.getElementById('debt-note').value.trim();
  var name=inst+(debtType?' ('+debtType+')':'');
  // acc: ถ้าแก้ไขใช้ acc เดิม, ถ้าเพิ่มใหม่ให้เลือกตาม tab ปัจจุบัน
  var acc=_editDebtAcc||_acc;
  var debtObj={name:name,institution:inst,debtType:debtType,
    total:total,originalTotal:orig||total,
    interestRate:interestRate,interestType:interestType,
    installment:install,paidCount:paidCount,extraPaid:extraPaid,
    nextDue:nextDue,note:note};
  if(_editDebtId){
    DATA[acc].debts.forEach(function(d){
      if(d.id===_editDebtId){
        d.name=debtObj.name;d.institution=debtObj.institution;d.debtType=debtObj.debtType;
        d.total=debtObj.total;d.originalTotal=debtObj.originalTotal;
        d.interestRate=debtObj.interestRate;d.interestType=debtObj.interestType;
        d.installment=debtObj.installment;d.paidCount=debtObj.paidCount;d.extraPaid=debtObj.extraPaid;
        d.nextDue=debtObj.nextDue;d.note=debtObj.note;
      }
    });
  } else {
    debtObj.id=Date.now()+'';
    DATA[acc].debts.push(debtObj);
  }
  saveData();closeModal('modal-debt');renderDebt();showToast('บันทึกสินเชื่อแล้ว');
}

function deleteDebt(){
  if(!confirm('ยืนยันลบสินเชื่อนี้?'))return;
  DATA[_editDebtAcc].debts=DATA[_editDebtAcc].debts.filter(function(d){return d.id!==_editDebtId;});
  saveData();closeModal('modal-debt');renderDebt();showToast('ลบสินเชื่อแล้ว');
}

window.addEventListener('load',function(){
  // redirect ไป index ถ้าเปิดโดยตรง (ไม่ได้มาจาก nav)
  if(!sessionStorage.getItem('appStarted')){
    var hash=window.location.hash;
    if(!hash||hash.indexOf('#debt-')!==0){
      sessionStorage.setItem('appStarted','1');
      window.location.replace('index.html');
      return;
    }
  }
  sessionStorage.setItem('appStarted','1');

  document.querySelectorAll('.modal-overlay').forEach(function(el){
    el.addEventListener('click',function(e){if(e.target===this){this.classList.remove('open');document.body.style.overflow='';}});
  });

  // Pull จาก GAS ก่อนเสมอ (GAS = master)
  _doInitialLoad();
  renderBudget();

  // hash navigation → เปิด debt modal
  var hash=window.location.hash;
  if(hash&&hash.indexOf('#debt-')===0){
    var parts=hash.replace('#debt-','').split('-');
    var hAcc=parts[0];
    var hId=parts.slice(1).join('-');
    if(hAcc&&hId){
      switchTab('debt');
      setTimeout(function(){renderDebt();openEditDebt(hAcc,hId);},400);
    }
    history.replaceState(null,'',window.location.pathname);
  }
});
</script>
</body>
