* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

/* reset browser defaults ที่ทำให้สีฟ้าโผล่ */
a,
a:visited,
a:link,
a:active {
  color: inherit;
  text-decoration: none;
}

button {
  color: inherit;
}

select,
input,
textarea {
  color: var(--text);
  accent-color: var(--primary);
}

select option {
  background: var(--surface);
  color: var(--text);
}

body {
  font-family: ‘Sarabun’, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ทำให้พื้นหลัง beige เต็มหน้าจอเสมอ แม้ content สั้น */
html,
body {
  background: #F5EFE6 !important;
}

/* ── HEADER ── */
.app-header {
  background: #6C3212;
  color: #FAF0E6;
  padding: 18px 20px 22px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 6px 24px rgba(61, 35, 20, 0.22);
  margin-bottom: 0;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.app-title {
  font-family: ‘Mitr’, sans-serif;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.3px;
}

.header-date {
  font-size: 12px;
  opacity: 0.75;
  margin-top: 3px;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.1);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.sync-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
  font-size: 11px;
  opacity: 0.7;
}

.sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #A89070;
}

.sync-dot.offline {
  background: #C07050;
}

/* ── SCROLL BODY ── */
.main-content {
  padding: 16px 15px 100px;
  margin-top: 0;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

/* ── SECTION LABEL ── */
.sec-label {
  font-family: ‘Mitr’, sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #8A7A68;
  margin: 18px 0 8px;
}

/* ── SUMMARY STRIP ── */
.summary-strip {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 2px;
}

.sum-card {
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 8px;
  text-align: center;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.sum-label {
  font-size: 11px;
  color: #8A7A68 !important;
  margin-bottom: 5px;
}

.sum-value {
  font-family: ‘Mitr’, sans-serif;
  font-size: 15px;
  font-weight: 600;
}

.sum-value {
  font-family: 'Mitr', sans-serif !important;
}

.sum-value.income {
  color: #4A5E38 !important;
}

.sum-value.expense {
  color: #7A3020 !important;
}

.sum-value.pos {
  color: #2C2010 !important;
}

.sum-value.neg {
  color: #7A3020 !important;
}

/* ── ALERTS ── */
.alert-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.alert-item {
  background: var(--surface);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  border-left: 3px solid #9C4722;
  cursor: pointer;
  transition: background 0.15s;
}

.alert-item:active {
  background: #E2DCCE;
}

.alert-item.overdue {
  border-left-color: #7A3020;
}

.alert-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #9C4722;
  flex-shrink: 0;
}

.alert-dot.overdue {
  background: #7A3020;
}

.alert-info {
  flex: 1;
}

.alert-name {
  font-size: 14px;
  font-weight: 500;
}

.alert-due {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 1px;
}

.alert-amount {
  font-family: ‘Mitr’, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #7A3020;
  white-space: nowrap;
}

.no-item {
  background: #E5DFD2;
  border-radius: var(--r);
  padding: 14px 16px;
  text-align: center;
  color: #8A7A68;
  font-size: 13px;
  border: 1px solid var(--border);
}

/* ── ACCOUNT BUTTONS ── */
.account-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.account-btn {
  border-radius: var(--r);
  padding: 20px 14px;
  border: none;
  cursor: pointer;
  text-align: left;
  transition: transform 0.12s;
  position: relative;
  overflow: hidden;
}

.account-btn:active {
  transform: scale(0.97);
}

.account-btn.home {
  background: #9C4722;
  color: #FAF0E6;
  box-shadow: 0 6px 20px rgba(156, 71, 34, 0.35);
}

.account-btn.farm {
  background: #C87629;
  color: #FAF0E6;
  box-shadow: 0 6px 20px rgba(200, 118, 41, 0.35);
}

.acc-name {
  font-family: ‘Mitr’, sans-serif;
  font-size: 18px;
  font-weight: 600;
  display: block;
  margin-bottom: 10px;
}

.acc-balance {
  font-size: 12px;
  opacity: 0.85;
  display: block;
  margin-bottom: 8px;
}

.acc-view-link {
  font-size: 11px;
  opacity: 0.65;
  display: block;
  letter-spacing: 0.3px;
  color: rgba(242, 237, 228, 0.8) !important;
  -webkit-text-fill-color: rgba(242, 237, 228, 0.8) !important;
}

.acc-line {
  width: 28px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.35);
  margin-bottom: 10px;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: #FDFAF6;
  border-top: 1px solid #E0D5C4;
  display: flex;
  z-index: 200;
  box-shadow: 0 -4px 24px rgba(61, 35, 20, 0.12);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.nav-btn {
  flex: 1;
  padding: 10px 4px 14px;
  border: none;
  background: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: #8A7A68 !important;
  -webkit-text-fill-color: #8A7A68 !important;
  transition: color 0.2s;
  font-family: ‘Sarabun’, sans-serif;
  -webkit-appearance: none;
  outline: none;
}

.nav-btn.active {
  color: #6C3212 !important;
  -webkit-text-fill-color: #6C3212 !important;
}

.nav-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-label {
  font-size: 10px;
  font-weight: 500;
}

/* ── PAGES ── */
.page {
  display: none;
}

.page.active {
  display: block;
}

/* ── ACCOUNT PAGE HEADER ── */
.acc-header {
  background: #6C3212;
  color: #FAF0E6;
  padding: 16px 16px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 6px 24px rgba(61, 35, 20, 0.22);
}

.acc-header.farm {
  background: #C87629;
}

.acc-header-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.back-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.1);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.acc-header h2 {
  font-family: ‘Mitr’, sans-serif;
  font-size: 17px;
  font-weight: 600;
}

.acc-header .summary-strip .sum-card {
  background: rgba(255, 240, 220, 0.15);
  border: 1px solid rgba(255, 240, 220, 0.25);
  border-radius: 12px;
}

.acc-header .sum-label {
  color: rgba(255, 255, 255, 0.7);
}

.acc-header .sum-value {
  color: white;
  font-size: 14px;
}

/* ── MONTH SELECTOR ── */
.month-selector {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #FDFAF6;
  border-radius: var(--r);
  padding: 10px 14px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}

.month-nav {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-sub);
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.month-label {
  font-family: ‘Mitr’, sans-serif;
  font-size: 15px;
  font-weight: 500;
}

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  background: #F0E8DB;
  border-radius: 24px;
  padding: 4px;
  gap: 4px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 3px rgba(61, 35, 20, 0.08);
}

.tab-btn {
  flex: 1;
  padding: 8px 4px;
  border: none;
  background: none;
  border-radius: 20px;
  font-family: ‘Sarabun’, sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: #7A6A58 !important;
  -webkit-text-fill-color: #7A6A58 !important;
  transition: all 0.18s;
}

.tab-btn.active {
  background: #6C3212;
  color: #F2EDE4 !important;
  -webkit-text-fill-color: #F2EDE4 !important;
}

.tab-btn.active.farm-tab {
  background: var(--brown);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* ── TRANSACTION LIST — Coffee UI Row Style ── */
.trans-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.trans-item {
  background: var(--surface);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s;
}

.trans-item:active {
  transform: scale(0.98);
}

/* Coffee UI: icon circle แทน bar */
.trans-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 18px;
}

.trans-icon.income {
  background: #D8E8D0;
}

.trans-icon.expense {
  background: #EAD4CC;
}

.trans-icon svg {
  width: 20px;
  height: 20px;
}

.trans-info {
  flex: 1;
  min-width: 0;
}

.trans-name {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #2A1A0E !important;
  -webkit-text-fill-color: #2A1A0E !important;
}

.trans-meta {
  font-size: 11px;
  color: #8A7060 !important;
  -webkit-text-fill-color: #8A7060 !important;
  margin-top: 2px;
}

.trans-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.trans-amount {
  font-family: ‘Mitr’, sans-serif;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
}

.trans-amount.income {
  color: #4A7A3A !important;
  -webkit-text-fill-color: #4A7A3A !important;
}

.trans-amount.expense {
  color: #8B3020 !important;
  -webkit-text-fill-color: #8B3020 !important;
}

/* legacy bar — hidden, replaced by icon */
.trans-bar {
  display: none;
}

/* ── FILTER CHIPS ── */
.filter-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.filter-chip {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-family: ‘Sarabun’, sans-serif;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  color: #7A6A58 !important;
  -webkit-text-fill-color: #7A6A58 !important;
  transition: all 0.15s;
}

.filter-chip.active {
  background: #6C3212;
  border-color: #2C2010;
  color: #F2EDE4;
}

.fab {
  position: fixed;
  bottom: 80px;
  right: max(16px, calc(50vw - 240px + 16px));
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: #6C3212;
  color: #FAF0E6;
  border: none;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(61, 35, 20, 0.38);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 150;
  transition: transform 0.15s, box-shadow 0.15s;
  font-weight: 300;
  line-height: 1;
}

.fab:active {
  transform: scale(0.90);
  box-shadow: 0 2px 12px rgba(61, 35, 20, 0.30);
}

.fab.farm-mode {
  background: #9C4722;
}

/* ── MODAL ── */
.modal-overlay {
  position: fixed;
  top: 0; bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100vw;
  max-width: 480px;
  background: rgba(0,0,0,0.4);
  z-index: 9000;
  display: none;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
}

.modal-overlay.open {
  display: flex;
  pointer-events: all;
}

.modal-sheet {
  background: #EDE7DB;
  border-radius: 28px 28px 0 0;
  width: 100%;
  max-width: 480px;
  margin: 0;
  padding: 20px 24px 52px;
  max-height: 88vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
  box-shadow: 0 -4px 32px rgba(61,35,20,0.18);
}

@keyframes slideUp {
  from {
    transform: translateY(100%);
    opacity: 0.5;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal-handle {
  width: 36px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 14px;
}

.modal-title {
  font-family: ‘Mitr’, sans-serif;
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 18px;
  text-align: center;
  color: var(--text);
}

/* ── FORM ── */
.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.4px;
  color: #6A5848;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.form-control {
  width: 100%;
  padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: ‘Sarabun’, sans-serif;
  font-size: 15px;
  color: var(--text);
  background: #F2EDE4;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

.form-control:focus {
  border-color: #2C2010;
}

.type-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.type-btn {
  padding: 11px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: #E0DAD0;
  cursor: pointer;
  font-family: ‘Sarabun’, sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: #4A3C2C !important;
  -webkit-text-fill-color: #4A3C2C !important;
  transition: all 0.18s;
}

.type-btn.active-income {
  border-color: #4A5E38;
  background: #DDE6D8;
  color: #344A28;
}

.type-btn.active-expense {
  border-color: #7A3020;
  background: #EDD8D4;
  color: #7A3020;
}

.btn-primary {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #6C3212;
  color: #FAF0E6 !important;
  -webkit-text-fill-color: #FAF0E6 !important;
  font-family: ‘Mitr’, sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(61, 35, 20, 0.30);
  letter-spacing: 0.3px;
}

.btn-primary:active {
  transform: scale(0.97);
  box-shadow: none;
}

.btn-primary.farm {
  background: #9C4722;
}

.btn-ghost {
  width: 100%;
  padding: 12px;
  border: none;
  background: none;
  color: #6A5E4E !important;
  -webkit-text-fill-color: #6A5E4E !important;
  font-family: ‘Sarabun’, sans-serif;
  font-size: 14px;
  cursor: pointer;
  margin-top: 4px;
}

/* ── BUDGET — Coffee UI card style ── */
.budget-card {
  background: var(--surface);
  border-radius: var(--r);
  padding: 15px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s;
}

.budget-card:active {
  transform: scale(0.98);
}

.budget-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.budget-name {
  font-size: 14px;
  font-weight: 600;
  color: #2A1A0E !important;
  -webkit-text-fill-color: #2A1A0E !important;
}

.budget-amounts {
  font-family: ‘Mitr’, sans-serif;
  font-size: 12px;
  color: #8A7060 !important;
  -webkit-text-fill-color: #8A7060 !important;
}

.budget-bar {
  height: 8px;
  background: #E8DDD0;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 6px;
}

.budget-fill {
  height: 100%;
  border-radius: 3px;
  background: #6C3212;
  transition: width 0.5s ease;
}

.budget-fill.warn {
  background: #C87629;
}

.budget-fill.over {
  background: #7A3020;
}

.budget-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.budget-pct {
  font-size: 11px;
  color: var(--text-sub);
}

.locked-tag {
  font-size: 10px;
  color: var(--text-sub);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;

  bb.style.background=tab==='budget'?'rgba(255,255,255,0.22)':'transparent';
  bb.style.color=tab==='budget'?'#FAF0E6':'rgba(250,240,230,0.65)';
  bb.style.webkitTextFillColor=tab==='budget'?'#FAF0E6':'rgba(250,240,230,0.65)';
  db.style.background=tab==='debt'?'rgba(255,255,255,0.22)':'transparent';
  db.style.color=tab==='debt'?'#FAF0E6':'rgba(250,240,230,0.65)';
  db.style.webkitTextFillColor=tab==='debt'?'#FAF0E6':'rgba(250,240,230,0.65)';
  bt.classList.toggle('active',tab==='budget');
  dt.classList.toggle('active',tab==='debt');
}

function mgRenderBudget(){
  var now=new Date(),m=now.getMonth(),y=now.getFullYear();
  var key=y+'-'+String(m+1).padStart(2,'0');
  document.getElementById('mg-budget-month-lbl').textContent=MONTHS_TH[m]+' '+(y+543);
  var budgets=DATA[_mgAcc].budgets.filter(function(b){return b.month===key;});
  var txs=DATA[_mgAcc].transactions.filter(function(t){var d=new Date(t.date);return d.getMonth()===m&&d.getFullYear()===y&&t.type==='expense';});
  var el=document.getElementById('mg-budget-list');
  if(!budgets.length){el.innerHTML='<div class="no-item">ยังไม่มีงบประมาณเดือนนี้</div>';return;}
  el.innerHTML=budgets.map(function(b){
    var spent=txs.filter(function(t){return t.category===b.category;}).reduce(function(s,t){return s+t.amount;},0);
    var pct=b.amount>0?Math.min(Math.round(spent/b.amount*100),100):0;
    var cls=pct>=100?'over':pct>=75?'warn':'';
    return '<div class="budget-card">'
      +'<div class="budget-header"><div class="budget-name">'+b.category+'</div>'
      +'<div class="budget-amounts">'+fmt(spent)+' / '+fmt(b.amount)+' บาท</div></div>'
      +'<div class="budget-bar"><div class="budget-fill '+cls+'" style="width:'+pct+'%"></div></div>'
      +'<div class="budget-foot"><div class="budget-pct">'+pct+'% ใช้ไปแล้ว</div>'
      +(b.locked?'<span class="locked-tag">&#x1F512; ล็อค</span>':'')+'</div></div>';
  }).join('');
}

function mgRenderDebt(){
  var debts=DATA[_mgAcc].debts;
  var el=document.getElementById('mg-debt-list');
  if(!debts.length){el.innerHTML='<div class="no-item">ยังไม่มีรายการหนี้</div>';return;}
  var today=new Date();today.setHours(0,0,0,0);
  el.innerHTML=debts.map(function(d,i){
    var due=d.nextDue?new Date(d.nextDue):null;
    if(due)due.setHours(0,0,0,0);
    var diff=due?Math.round((due-today)/86400000):null;
    var st=diff===null?'ok':diff<0?'overdue':diff<=7?'soon':'ok';
    var stTxt=diff===null?'ปกติ':diff<0?'เกินกำหนด '+Math.abs(diff)+' วัน':diff===0?'ครบกำหนดวันนี้':diff<=7?'อีก '+diff+' วัน':'ปกติ';
    return '<div class="debt-card">'
      +'<div class="debt-header"><div class="debt-name">'+d.name+'</div><div class="debt-total">'+fmt(d.total)+' บาท</div></div>'
      +'<div class="debt-detail">งวดละ '+fmt(d.installment)+' บาท'+(d.note?' · '+d.note:'')+'</div>'
      +(d.nextDue?'<div style="margin-bottom:6px;">ครบกำหนด: '+formatDateTH(d.nextDue)+' <span class="status-tag '+st+'">'+stTxt+'</span></div>':'')
      +'<button class="pay-btn" onclick="mgPayDebt('+i+')">บันทึกการชำระงวด</button></div>';
  }).join('');
}

function openBudgetModal(){
  var sel=document.getElementById('budget-cat');
  sel.innerHTML='<option value="">เลือกหมวดหมู่</option>'+CATEGORIES[_mgAcc].expense.map(function(c){return '<option>'+c+'</option>';}).join('');
  document.getElementById('budget-amount').value='';
  var now=new Date();
  document.getElementById('budget-month').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  openModal('modal-budget');
}

function openDebtModal(){
  document.getElementById('debt-name').value='';
  document.getElementById('debt-total').value='';
  document.getElementById('debt-install').value='';
  document.getElementById('debt-due').value=todayStr();
  document.getElementById('debt-note').value='';
  openModal('modal-debt');
}

function saveBudget(){
  var cat=document.getElementById('budget-cat').value;
  var amount=parseFloat(document.getElementById('budget-amount').value);
  var month=document.getElementById('budget-month').value;
  if(!cat){alert('กรุณาเลือกหมวดหมู่');return;}
  if(!amount||amount<=0){alert('กรุณาระบุจำนวนเงิน');return;}
  if(!month){alert('กรุณาระบุเดือน');return;}
  var idx=DATA[_mgAcc].budgets.findIndex(function(b){return b.category===cat&&b.month===month;});
  if(idx>=0){if(!confirm('มีงบหมวดนี้แล้ว ต้องการแทนที่?'))return;DATA[_mgAcc].budgets.splice(idx,1);}
  DATA[_mgAcc].budgets.push({category:cat,amount:amount,month:month,locked:true});
  saveData();closeModal('modal-budget');mgRenderBudget();showToast('บันทึกงบประมาณแล้ว');
}

function saveDebt(){
  var name=document.getElementById('debt-name').value.trim();
  var total=parseFloat(document.getElementById('debt-total').value);
  var install=parseFloat(document.getElementById('debt-install').value)||0;
  var due=document.getElementById('debt-due').value;
  var note=document.getElementById('debt-note').value.trim();
  if(!name){alert('กรุณาระบุชื่อหนี้');return;}
  if(!total||total<=0){alert('กรุณาระบุยอดหนี้');return;}
  DATA[_mgAcc].debts.push({id:Date.now()+'',name:name,total:total,installment:install,nextDue:due,note:note});
  saveData();closeModal('modal-debt');mgRenderDebt();showToast('บันทึกหนี้สินแล้ว');
}

function mgPayDebt(i){
  var d=DATA[_mgAcc].debts[i];
  if(!confirm('ยืนยันการชำระ '+fmt(d.installment)+' บาท สำหรับ "'+d.name+'"?'))return;
  d.total=Math.max(0,d.total-d.installment);
  if(d.nextDue){
    var nd=new Date(d.nextDue);nd.setMonth(nd.getMonth()+1);
    d.nextDue=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-'+String(nd.getDate()).padStart(2,'0');
  }
  if(d.total<=0)DATA[_mgAcc].debts.splice(i,1);
  saveData();mgRenderDebt();showToast('บันทึกการชำระแล้ว');
}

window.addEventListener('load',function(){
  document.querySelectorAll('.modal-overlay').forEach(function(el){
    el.addEventListener('click',function(e){if(e.target===this){this.classList.remove('open');document.body.style.overflow='';}});
  });
  init();
});
</script>
