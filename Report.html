* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

/* reset browser defaults ที่ทำให้สีฟ้าโผล่ */
a,
a:visited,
a:link,
a:active {
  color: inherit;
  text-decoration: none;
}

button {
  color: inherit;
}

select,
input,
textarea {
  color: var(--text);
  accent-color: var(--primary);
}

select option {
  background: var(--surface);
  color: var(--text);
}

body {
  font-family: ‘Sarabun’, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  overflow-x: hidden;
}

/* ทำให้พื้นหลัง beige เต็มหน้าจอเสมอ แม้ content สั้น */
html,
body {
  background: #F5EFE6 !important;
}

/* ── HEADER ── */
.app-header {
  background: #6C3212;
  color: #FAF0E6;
  padding: 18px 20px 22px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 6px 24px rgba(61, 35, 20, 0.22);
  margin-bottom: 0;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.app-title {
  font-family: ‘Mitr’, sans-serif;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.3px;
}

.header-date {
  font-size: 12px;
  opacity: 0.75;
  margin-top: 3px;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.1);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.sync-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
  font-size: 11px;
  opacity: 0.7;
}

.sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #A89070;
}

.sync-dot.offline {
  background: #C07050;
}

/* ── SCROLL BODY ── */
.main-content {
  padding: 16px 15px 100px;
  margin-top: 0;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

/* ── SECTION LABEL ── */
.sec-label {
  font-family: ‘Mitr’, sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #8A7A68;
  margin: 18px 0 8px;
}

/* ── SUMMARY STRIP ── */
.summary-strip {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 2px;
}

.sum-card {
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 8px;
  text-align: center;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.sum-label {
  font-size: 11px;
  color: #8A7A68 !important;
  margin-bottom: 5px;
}

.sum-value {
  font-family: ‘Mitr’, sans-serif;
  font-size: 15px;
  font-weight: 600;
}

.sum-value {
  font-family: 'Mitr', sans-serif !important;
}

.sum-value.income {
  color: #4A5E38 !important;
}

.sum-value.expense {
  color: #7A3020 !important;
}

.sum-value.pos {
  color: #2C2010 !important;
}

.sum-value.neg {
  color: #7A3020 !important;
}

/* ── ALERTS ── */
.alert-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.alert-item {
  background: var(--surface);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  border-left: 3px solid #9C4722;
  cursor: pointer;
  transition: background 0.15s;
}

.alert-item:active {
  background: #E2DCCE;
}

.alert-item.overdue {
  border-left-color: #7A3020;
}

.alert-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #9C4722;
  flex-shrink: 0;
}

.alert-dot.overdue {
  background: #7A3020;
}

.alert-info {
  flex: 1;
}

.alert-name {
  font-size: 14px;
  font-weight: 500;
}

.alert-due {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 1px;
}

.alert-amount {
  font-family: ‘Mitr’, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #7A3020;
  white-space: nowrap;
}

.no-item {
  background: #E5DFD2;
  border-radius: var(--r);
  padding: 14px 16px;
  text-align: center;
  color: #8A7A68;
  font-size: 13px;
  border: 1px solid var(--border);
}

/* ── ACCOUNT BUTTONS ── */
.account-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.account-btn {
  border-radius: var(--r);
  padding: 20px 14px;
  border: none;
  cursor: pointer;
  text-align: left;
  transition: transform 0.12s;
  position: relative;
  overflow: hidden;
}

.account-btn:active {
  transform: scale(0.97);
}

.account-btn.home {
  background: #9C4722;
  color: #FAF0E6;
  box-shadow: 0 6px 20px rgba(156, 71, 34, 0.35);
}

.account-btn.farm {
  background: #C87629;
  color: #FAF0E6;
  box-shadow: 0 6px 20px rgba(200, 118, 41, 0.35);
}

.acc-name {
  font-family: ‘Mitr’, sans-serif;
  font-size: 18px;
  font-weight: 600;
  display: block;
  margin-bottom: 10px;
}

.acc-balance {
  font-size: 12px;
  opacity: 0.85;
  display: block;
  margin-bottom: 8px;
}

.acc-view-link {
  font-size: 11px;
  opacity: 0.65;
  display: block;
  letter-spacing: 0.3px;
  color: rgba(242, 237, 228, 0.8) !important;
  -webkit-text-fill-color: rgba(242, 237, 228, 0.8) !important;
}

.acc-line {
  width: 28px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.35);
  margin-bottom: 10px;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: #FDFAF6;
  border-top: 1px solid #E0D5C4;
  display: flex;
  z-index: 200;
  box-shadow: 0 -4px 24px rgba(61, 35, 20, 0.12);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.nav-btn {
  flex: 1;
  padding: 10px 4px 14px;
  border: none;
  background: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: #8A7A68 !important;
  -webkit-text-fill-color: #8A7A68 !important;
  transition: color 0.2s;
  font-family: ‘Sarabun’, sans-serif;
  -webkit-appearance: none;
  outline: none;
}

.nav-btn.active {
  color: #6C3212 !important;
  -webkit-text-fill-color: #6C3212 !important;
}

.nav-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-label {
  font-size: 10px;
  font-weight: 500;
}

/* ── PAGES ── */
.page {
  display: none;
}

.page.active {
  display: block;
}

/* ── ACCOUNT PAGE HEADER ── */
.acc-header {
  background: #6C3212;
  color: #FAF0E6;
  padding: 16px 16px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 6px 24px rgba(61, 35, 20, 0.22);
}

.acc-header.farm {
  background: #C87629;
}

.acc-header-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.back-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.1);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.acc-header h2 {
  font-family: ‘Mitr’, sans-serif;
  font-size: 17px;
  font-weight: 600;
}

.acc-header .summary-strip .sum-card {
  background: rgba(255, 240, 220, 0.15);
  border: 1px solid rgba(255, 240, 220, 0.25);
  border-radius: 12px;
}

.acc-header .sum-label {
  color: rgba(255, 255, 255, 0.7);
}

.acc-header .sum-value {
  color: white;
  font-size: 14px;
}

/* ── MONTH SELECTOR ── */
.month-selector {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #FDFAF6;
  border-radius: var(--r);
  padding: 10px 14px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}

.month-nav {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-sub);
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.month-label {
  font-family: ‘Mitr’, sans-serif;
  font-size: 15px;
  font-weight: 500;
}

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  background: #F0E8DB;
  border-radius: 24px;
  padding: 4px;
  gap: 4px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 3px rgba(61, 35, 20, 0.08);
}

.tab-btn {
  flex: 1;
  padding: 8px 4px;
  border: none;
  background: none;
  border-radius: 20px;
  font-family: ‘Sarabun’, sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: #7A6A58 !important;
  -webkit-text-fill-color: #7A6A58 !important;
  transition: all 0.18s;
}

.tab-btn.active {
  background: #6C3212;
  color: #F2EDE4 !important;
  -webkit-text-fill-color: #F2EDE4 !important;
}

.tab-btn.active.farm-tab {
  background: var(--brown);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* ── TRANSACTION LIST — Coffee UI Row Style ── */
.trans-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.trans-item {
  background: var(--surface);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s;
}

.trans-item:active {
  transform: scale(0.98);
}

/* Coffee UI: icon circle แทน bar */
.trans-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 18px;
}

.trans-icon.income {
  background: #D8E8D0;
}

.trans-icon.expense {
  background: #EAD4CC;
}

.trans-icon svg {
  width: 20px;
  height: 20px;
}

.trans-info {
  flex: 1;
  min-width: 0;
}

.trans-name {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #2A1A0E !important;
  -webkit-text-fill-color: #2A1A0E !important;
}

.trans-meta {
  font-size: 11px;
  color: #8A7060 !important;
  -webkit-text-fill-color: #8A7060 !important;
  margin-top: 2px;
}

.trans-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.trans-amount {
  font-family: ‘Mitr’, sans-serif;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
}

.trans-amount.income {
  color: #4A7A3A !important;
  -webkit-text-fill-color: #4A7A3A !important;
}

.trans-amount.expense {
  color: #8B3020 !important;
  -webkit-text-fill-color: #8B3020 !important;
}

/* legacy bar — hidden, replaced by icon */
.trans-bar {
  display: none;
}

/* ── FILTER CHIPS ── */
.filter-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.filter-chip {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-family: ‘Sarabun’, sans-serif;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  color: #7A6A58 !important;
  -webkit-text-fill-color: #7A6A58 !important;
  transition: all 0.15s;
}

.filter-chip.active {
  background: #6C3212;
  border-color: #2C2010;
  color: #F2EDE4;
}

.fab {
  position: fixed;
  bottom: 80px;
  right: max(16px, calc(50vw - 240px + 16px));
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: #6C3212;
  color: #FAF0E6;
  border: none;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(61, 35, 20, 0.38);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 150;
  transition: transform 0.15s, box-shadow 0.15s;
  font-weight: 300;
  line-height: 1;
}

.fab:active {
  transform: scale(0.90);
  box-shadow: 0 2px 12px rgba(61, 35, 20, 0.30);
}

.fab.farm-mode {
  background: #9C4722;
}

/* ── MODAL ── */
.modal-overlay {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100vw;
  background: rgba(0, 0, 0, 0.4);
  z-index: 9000;
  display: none;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
}

.modal-overlay.open {
  display: flex;
  pointer-events: all;
}

.modal-sheet {
  background: #EDE7DB;
  border-radius: 28px 28px 0 0;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 16px 20px 60px;
  max-height: 92vh;
  overflow-y: auto;
  overflow-x: hidden;
  animation: slideUp 0.25s ease;
  box-shadow: 0 -4px 32px rgba(61,35,20,0.18);
}

@keyframes slideUp {
  from {
    transform: translateY(100%);
    opacity: 0.5;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal-handle {
  width: 36px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 14px;
}

.modal-title {
  font-family: ‘Mitr’, sans-serif;
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 18px;
  text-align: center;
  color: var(--text);
}

/* ── FORM ── */
.form-group {
  margin-bottom: 13px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.4px;
  color: #6A5848;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.form-control {
  width: 100%;
  padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: ‘Sarabun’, sans-serif;
  font-size: 15px;
  color: var(--text);
  background: #F2EDE4;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

.form-control:focus {
  border-color: #2C2010;
}

.type-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.type-btn {
  padding: 11px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: #E0DAD0;
  cursor: pointer;
  font-family: ‘Sarabun’, sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: #4A3C2C !important;
  -webkit-text-fill-color: #4A3C2C !important;
  transition: all 0.18s;
}

.type-btn.active-income {
  border-color: #4A5E38;
  background: #DDE6D8;
  color: #344A28;
}

.type-btn.active-expense {
  border-color: #7A3020;
  background: #EDD8D4;
  color: #7A3020;
}

.btn-primary {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #6C3212;
  color: #FAF0E6 !important;
  -webkit-text-fill-color: #FAF0E6 !important;
  font-family: ‘Mitr’, sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(61, 35, 20, 0.30);
  letter-spacing: 0.3px;
}

.btn-primary:active {
  transform: scale(0.97);
  box-shadow: none;
}

.btn-primary.farm {
  background: #9C4722;
}

.btn-ghost {
  width: 100%;
  padding: 12px;
  border: none;
  background: none;
  color: #6A5E4E !important;
  -webkit-text-fill-color: #6A5E4E !important;
  font-family: ‘Sarabun’, sans-serif;
  font-size: 14px;
  cursor: pointer;
  margin-top: 4px;
}

/* ── BUDGET — Coffee UI card style ── */
.budget-card {
  background: var(--surface);
  border-radius: var(--r);
  padding: 15px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s;
}

.budget-card:active {
  transform: scale(0.98);
}

.budget-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.budget-name {
  font-size: 14px;
  font-weight: 600;
  color: #2A1A0E !important;
  -webkit-text-fill-color: #2A1A0E !important;
}

.budget-amounts {
  font-family: ‘Mitr’, sans-serif;
  font-size: 12px;
  color: #8A7060 !important;
  -webkit-text-fill-color: #8A7060 !important;
}

.budget-bar {
  height: 8px;
  background: #E8DDD0;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 6px;
}

.budget-fill {
  height: 100%;
  border-radius: 3px;
  background: #6C3212;
  transition: width 0.5s ease;
}

.budget-fill.warn {
  background: #C87629;
}

.budget-fill.over {
  background: #7A3020;
}

.budget-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.budget-pct {

function rpSwitchTab(tab) {

}

function yoyInitYears() {
  var years = new Set();
  var now = new Date().getFullYear();
  years.add(now); years.add(now - 1);
  ['home', 'farm'].forEach(function (acc) {
    DATA[acc].transactions.forEach(function (t) {
      years.add(new Date(t.date).getFullYear());
    });
  });
  var sorted = Array.from(years).sort(function (a, b) { return b - a; });
  ['yoy-year-a', 'yoy-year-b'].forEach(function (id, i) {
    var sel = document.getElementById(id);
    var cur = parseInt(sel.value) || 0;
    sel.innerHTML = sorted.map(function (y) {
      var isSelected = cur ? (y === cur) : (y === sorted[i]);
      return '<option value="' + y + '" ' + (isSelected ? 'selected' : '') + '>' + (y + 543) + '</option>';
    }).join('');
  });
}

function yoyGetYearData(acc, year) {
  var monthly = Array.from({ length: 12 }, function () { return { inc: 0, exp: 0 }; });
  var catMap = {};
  DATA[acc].transactions.forEach(function (t) {
    var d = new Date(t.date);
    if (d.getFullYear() !== year) return;
    var m = d.getMonth();
    if (t.type === 'income') monthly[m].inc += t.amount;
    else { monthly[m].exp += t.amount; var k = t.category || 'อื่นๆ'; catMap[k] = (catMap[k] || 0) + t.amount; }
  });
  var totalInc = monthly.reduce(function (s, m) { return s + m.inc; }, 0);
  var totalExp = monthly.reduce(function (s, m) { return s + m.exp; }, 0);
  return { monthly: monthly, catMap: catMap, totalInc: totalInc, totalExp: totalExp };
}

function yoyCalcPct(a, b) { if (!b || b === 0) return null; return ((a - b) / b) * 100; }

function yoyPctColor(pct, isExpense) {
  if (pct === null) return '#8A7060';
  if (isExpense) return pct > 0 ? '#8B3020' : '#4A7A3A';
  return pct > 0 ? '#4A7A3A' : '#8B3020';
}

function yoyPctText(pct) {
  if (pct === null) return '—';
  return (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
}
